<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>BrainOrder</title>
<style>
:root{
  --bg:#0d0e12; --panel:#15171d; --panel2:#1c1f27; --line:#2a2e39; --text:#e9ebf0; --mute:#8b91a1;
  --acid:#c8f53c; --ok:#3ddc97; --org:#ffb547; --miss:#ff5d6c; --info:#6aa8ff;
  --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:13.5px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;border-radius:9px;padding:8px 14px;background:var(--panel2);color:var(--text);
  border:1px solid var(--line);transition:.15s;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;line-height:1.25}
button:hover{border-color:#3c4252;background:#232733}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--acid);color:#111;border-color:var(--acid);font-weight:650}
button.primary:hover{filter:brightness(1.07)}
button.warn{background:var(--org);color:#111;border-color:var(--org);font-weight:650}
button.ghost{background:transparent;border-color:transparent;color:var(--mute)}
button.ghost:hover{color:var(--text);background:var(--panel2)}
.mono{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-rows:auto auto auto 1fr;height:100vh}
header{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line);-webkit-app-region:drag}
header *{-webkit-app-region:no-drag}
.logo{font-weight:800;letter-spacing:-.02em;font-size:18px;margin-right:6px}
.logo span{color:var(--acid)}
.conn{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:12.5px;margin-right:auto}
.dot{width:8px;height:8px;border-radius:50%;background:var(--miss);flex:none}
.dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:18px;padding:0 6px;margin-left:6px;border-radius:10px;background:rgba(0,0,0,.25);font-size:11.5px;line-height:1;vertical-align:middle}
.progress{height:34px;display:flex;align-items:center;gap:10px;padding:0 20px;color:var(--mute);font-size:12.5px;border-bottom:1px solid var(--line);background:var(--panel);position:relative}
#progTxt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar{display:none;width:260px;height:8px;border-radius:5px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acid),var(--ok));border-radius:5px;transition:width .25s ease}
#ppct{display:none;width:42px;text-align:right;color:var(--text);font-weight:650}
.progress.haspct .pbar,.progress.haspct #ppct{display:block}
.progress.haspct::after{content:"";position:absolute;left:0;bottom:-1px;height:2px;width:var(--p,0%);background:var(--acid);transition:width .25s ease}
.pcard{max-width:520px;margin:60px auto;text-align:center}
.rules{max-width:860px}
.dg{border:1px solid var(--line);border-radius:10px;margin:10px 0;background:var(--panel)}
.dg .dh{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.dg .dh b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.df{display:grid;grid-template-columns:24px 24px 1fr auto;gap:10px;align-items:center;padding:8px 14px;border-top:1px solid rgba(255,255,255,.03)}
.df.keep{background:rgba(61,220,151,.06)}
.df .meta{font-size:12px;color:var(--mute);display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.bdg{font-size:11px;padding:1px 7px;border-radius:10px;border:1px solid var(--line);color:var(--mute)}
.bdg.rb{color:#ff7a59;border-color:rgba(255,122,89,.4)}
.bdg.mik{color:#b48cff;border-color:rgba(180,140,255,.4)}
.bdg.pl{color:var(--info);border-color:rgba(106,168,255,.4)}
.df select{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;max-width:340px}
.wiz{max-width:640px;width:100%}
.wiz .steps{display:flex;gap:6px;margin:0 0 16px}
.wiz .steps i{flex:1;height:4px;border-radius:3px;background:var(--line)}
.wiz .steps i.on{background:var(--acid)}
.wiz .opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin:8px 0;cursor:pointer;background:var(--panel2)}
.wiz .opt input[type=checkbox]{margin-top:3px}
.wiz .opt .tag{margin-left:6px;margin-right:0}
.wiz .big{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:4px 0 8px}
.cx{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0 0;background:var(--panel2)}
.cxh{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.cxh b{font-size:14px}
.tag{font-size:11.5px;color:var(--mute);border:1px solid var(--line);border-radius:20px;padding:1px 8px;margin-right:auto}
.tag.ok{color:var(--ok);border-color:rgba(61,220,151,.35)}
.sw{position:relative;width:38px;height:22px;flex:none;cursor:pointer}
.sw input{opacity:0;width:0;height:0}
.sw i{position:absolute;inset:0;background:var(--line);border-radius:22px;transition:.15s}
.sw i::after{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.15s}
.sw input:checked+i{background:var(--acid)}
.sw input:checked+i::after{transform:translateX(16px);background:#111}
.rules label.f{display:block;margin:10px 0 4px;color:var(--mute);font-size:12.5px}
.rules input.t{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit}
.rules section{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin:0 0 16px}
.rules h3{margin:0 0 4px;font-size:15px}
.rules .hint{color:var(--mute);font-size:12.5px;margin:0 0 12px}
.rules textarea,.rules input[type=number]{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit}
.rules textarea{width:100%;min-height:86px;font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:12.5px}
.rules input[type=number]{width:80px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chipx{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 6px 4px 10px;font-size:12.5px;max-width:100%}
.chipx span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chipx button{padding:0 6px;border:0;background:none;color:var(--mute)}
.prow{display:flex;align-items:center;gap:10px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;margin-bottom:5px;background:var(--panel2)}
.prow.ign{opacity:.5}
.prow.drag{outline:2px dashed var(--acid)}
.prow .hd{cursor:grab;color:var(--mute);user-select:none}
.prow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .ix{width:26px;color:var(--mute);text-align:right}
.prow button{padding:2px 8px}
.prow select{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:3px 6px;font:inherit}
.fmt{display:flex;gap:6px;flex-wrap:wrap}
.fmt .chipx{padding:4px 6px}
.rbar{position:sticky;bottom:-40px;background:var(--bg);border-top:1px solid var(--line);padding:14px 0 18px;display:flex;gap:10px;align-items:center}
#tasks{display:none;flex-direction:column;gap:4px;padding:6px 20px 8px;border-bottom:1px solid var(--line);background:var(--panel);max-height:140px;overflow:auto}
#tasks.on{display:flex}
.trow{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--mute)}
.trow b{color:var(--text);font-weight:650;white-space:nowrap}
.trow .tm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .pbar{display:block;width:200px;height:6px}
.trow .tp{width:40px;text-align:right;color:var(--text);font-weight:650}
.trow.queued b::after{content:" · en cola";color:var(--org);font-weight:500}
.trow.queued .pbar i{background:var(--line)}
.trow .tx{width:22px;height:22px;border-radius:6px;background:transparent;border:1px solid transparent;color:var(--mute)}
.trow .tx .ic{width:12px;height:12px}
.trow button.tx:hover{border-color:var(--miss);color:var(--miss)}
.spq-x{width:26px;height:26px;border-radius:6px;background:transparent;border:1px solid var(--line);color:var(--mute)}
.spq-x .ic{width:12px;height:12px}
.spq-x:hover{border-color:var(--miss);color:var(--miss)}
.pcard .big{font-size:56px;font-weight:800;letter-spacing:-.03em;color:var(--acid)}
.pcard .pbar{display:block;width:100%;height:12px;margin:14px 0 10px}
.spin{width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--acid);border-radius:50%;animation:s .8s linear infinite;display:none}
.busy .spin{display:block}
@keyframes s{to{transform:rotate(360deg)}}
.body{display:grid;grid-template-columns:270px 1fr;min-height:0}
aside{border-right:1px solid var(--line);overflow:auto;padding:14px 10px}
aside h4{margin:14px 10px 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:600}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:block;padding:8px 10px;border-radius:8px;color:var(--text);text-decoration:none;cursor:pointer}
.nav a:hover{background:var(--panel2)}
.nav a.sel{background:var(--panel2);box-shadow:inset 3px 0 0 var(--acid)}
.nav .row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.nav .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .cnt{font-size:11.5px;color:var(--mute)}
.bar{height:4px;border-radius:2px;background:var(--line);margin-top:6px;display:flex;overflow:hidden}
.bar i{display:block;height:100%}
main{overflow:auto;padding:20px 24px 40px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer}
.card:hover{border-color:#3c4252}
.card .k{font-size:11.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.card .v{font-size:28px;font-weight:750;margin-top:2px;letter-spacing:-.02em}
.card.ok .v{color:var(--ok)} .card.org .v{color:var(--org)} .card.miss .v{color:var(--miss)}
.vhead{display:flex;align-items:flex-end;gap:12px;margin:6px 0 12px;flex-wrap:wrap}
.vhead h2{margin:0;font-size:22px;letter-spacing:-.02em}
.vhead .sub{color:var(--mute);font-size:12.5px}
.vhead .sp{margin-left:auto;display:flex;gap:8px}
input.search{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:8px 12px;width:240px;font:inherit}
table{width:100%;border-collapse:collapse}
th{position:sticky;top:-20px;background:var(--bg);text-align:left;font-weight:600;font-size:11.5px;color:var(--mute);
  text-transform:uppercase;letter-spacing:.05em;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:8px 10px;border-bottom:1px solid #1d2028;vertical-align:top}
tr:hover td{background:#13151b}
td .art{color:var(--mute);font-size:12.5px}
.chip{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11.5px;margin:1px 4px 1px 0;border:1px solid var(--line);background:var(--panel2);white-space:nowrap;cursor:pointer}
.chip:hover{border-color:var(--acid)}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;white-space:nowrap}
.st:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st.ok{color:var(--ok)} .st.inbox{color:var(--org)} .st.elsewhere{color:var(--info)} .st.dup{color:var(--mute)} .st.missing{color:var(--miss)}
.path{color:var(--mute);font-size:12px;word-break:break-all;cursor:pointer}
.path:hover{color:var(--text)}
a.lnk{color:var(--acid);text-decoration:none;cursor:pointer;font-size:12px}
.empty{padding:70px 20px;text-align:center;color:var(--mute)}
.empty h3{color:var(--text);font-size:18px;margin:0 0 6px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:10;padding:20px}
.modal-bg.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:min(640px,100%);max-height:88vh;overflow:auto;padding:22px 24px}
.modal h3{margin:0 0 4px;font-size:18px}
.modal p{color:var(--mute);margin:4px 0 14px}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
label.f{display:block;margin:12px 0 4px;font-size:12px;color:var(--mute)}
input.t,textarea.t{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 10px;font:inherit}
textarea.t{min-height:70px;font-family:"SF Mono",Menlo,monospace;font-size:12px}
.box{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0;font-size:12.5px}
.box.warn{border-color:rgba(255,181,71,.5)}
.box b{color:var(--text)}
.frow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.frow .nm{flex:1;min-width:0}
.frow .nm div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:6px 10px;font-size:12px}
.seg button.on{background:var(--acid);color:#111;font-weight:650}
.pick{display:flex;gap:8px;align-items:center}
.pickpath{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
.pickpath:hover{border-color:#3c4252}
button.pa{border-color:rgba(106,168,255,.5);color:var(--info)}
button.pa.chg{border-color:var(--org);color:var(--org)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,181,71,.7)}100%{box-shadow:0 0 0 14px rgba(255,181,71,0)}}
.pulse{animation:pulse 1s ease-out 3}
button.ro{border-color:rgba(61,220,151,.45);color:var(--ok)}
select.rg{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;font-size:12.5px;max-width:100%}
details.rgg{border:1px solid var(--line);border-radius:10px;margin:8px 0;background:var(--panel)}
details.rgg summary{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;list-style:none}
details.rgg summary::-webkit-details-marker{display:none}
details.rgg summary .rg{margin-left:auto}
details.rgg table{margin:0 0 6px}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--text)}
th.sortable.on{color:var(--acid)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.chipf{padding:5px 11px;border-radius:20px;font-size:12px;background:var(--panel);border:1px solid var(--line);color:var(--mute)}
.chipf{align-items:baseline}
.chipf .mono{margin-left:5px;opacity:.8;line-height:1}
.kc{display:inline-block;min-width:34px;text-align:center;padding:2px 6px;border-radius:6px;color:#fff;font-size:12px;font-weight:650}
.kc sup{font-size:9px;opacity:.8}
.eb{display:inline-block;width:46px;height:6px;border-radius:4px;background:var(--line);overflow:hidden;vertical-align:middle;margin-right:6px}
.eb i{display:block;height:100%}
.chipf.nomik.on{background:#b48cff;border-color:#b48cff}
.chipf.on{color:#111;font-weight:650}
.chipf.all.on{background:var(--text);border-color:var(--text)}
.chipf.missing.on{background:var(--miss);border-color:var(--miss)}
.chipf.inbox.on{background:var(--org);border-color:var(--org)}
.chipf.elsewhere.on{background:var(--info);border-color:var(--info)}
.chipf.here.on{background:var(--ok);border-color:var(--ok)}
.oxrow{display:flex;gap:10px;align-items:flex-start;padding:7px 4px;cursor:pointer;border-bottom:1px solid #1d2028}
.oxrow input{margin-top:3px}
button.cp{padding:7px 11px;font-size:12.5px}
button.cp.sp{border-color:rgba(200,245,60,.45);color:var(--acid)}
button.cp.dz{border-color:rgba(167,139,250,.5);color:#a78bfa}
button.cp:hover:not(:disabled){background:rgba(255,255,255,.04)}
.vhead .sp{flex-wrap:wrap;justify-content:flex-end}
button.xl{border-color:rgba(52,211,153,.45);color:#34d399}
button.xl:hover{background:rgba(52,211,153,.1);border-color:#34d399}
#pvBar{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:19;display:none;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:8px 12px;box-shadow:0 10px 30px rgba(0,0,0,.45);width:min(760px,calc(100vw - 32px))}
#pvBar.on{display:flex}
body.pv-on #main{padding-bottom:90px} body.pv-on .toast{bottom:84px}
#pvBar .pvt{flex:1;min-width:0}
#pvBar .pvt b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
#pvBar .pvt span{font-size:11.5px;color:var(--mute)}
#pvBar input[type=range]{width:100%;accent-color:var(--acid);margin:2px 0 0}
#pvBar button{padding:4px 9px;font-size:12px}
#pvBar button.pvp{width:36px;height:36px;border-radius:50%;background:var(--acid);color:#111;border-color:var(--acid)}
#pvBar button.pvp .ic{width:16px;height:16px} #pvBar button.pvp .ld{width:16px;height:16px}
#pvBar #pvX{width:30px;height:28px}
.ib{display:inline-flex;align-items:center;justify-content:center;padding:0;line-height:0;flex:none;vertical-align:middle}
.ib .ic{display:block;width:14px;height:14px;pointer-events:none}
.ib.sq{width:28px;height:28px}
#plReload{width:26px;height:24px}
.ld{display:block;width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:ldspin .8s linear infinite}
@keyframes ldspin{to{transform:rotate(360deg)}}
.pv{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;padding:0;line-height:0;border-radius:50%;margin-right:8px;margin-top:-1px;background:transparent;border:1px solid var(--line);color:var(--mute);flex:none}
.pv .ic{width:10px;height:10px}
.pv:hover,.pv.on{border-color:var(--acid);color:var(--acid)}
.toast{position:fixed;bottom:18px;right:18px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 16px;max-width:420px;display:none;z-index:20;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.show{display:block}
.toast.err{border-color:var(--miss)}
.plsort{width:100%;background:var(--bg);color:var(--mute);border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:12px}
.cmenu{position:fixed;z-index:40;min-width:250px;max-width:380px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:5px;box-shadow:0 14px 34px rgba(0,0,0,.5);display:none}
.cmenu.show{display:block}
.cmenu .ci{display:flex;gap:8px;align-items:center;padding:7px 10px;border-radius:6px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.cmenu .ci:hover{background:var(--panel)}
.cmenu .ci.dis{opacity:.45;pointer-events:none}
.cmenu .ch{padding:6px 10px 4px;font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmenu .cs{height:1px;background:var(--line);margin:4px 6px}
#tbl tr[data-src]{cursor:context-menu}
code{background:var(--bg);padding:1px 6px;border-radius:5px;font-size:12px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">Brain<span>Order</span></div>
    <div class="conn"><div class="dot" id="dot"></div><span id="connTxt">Sin conectar</span><a id="spqTag" class="lnk" style="display:none;font-size:inherit;color:var(--org)" onclick="spqModal()" title="Ver y cancelar lo que espera para Spotify"></a></div>
    <button class="ghost" id="btnConn" onclick="connect()">Conectar Spotify</button>
    <button onclick="openSettings()">Ajustes</button>
    <button onclick="exportMissing()" id="btnExport" disabled>Exportar a Excel</button>
    <button class="primary" onclick="analyze()" id="btnAnalyze" title="Lee todas tus playlists de Spotify (tarda más)">Analizar todo</button>
    <button class="warn" onclick="askOrganize()" id="btnOrg" title="Archivos en tu carpeta de descargas" disabled>Organizar<span class="badge mono" id="orgBadge">0</span></button>
  </header>
  <div class="progress" id="prog"><div class="spin"></div><span id="progTxt">Listo.</span>
    <div class="pbar" id="pbar"><i id="pfill"></i></div><span class="mono" id="ppct"></span></div>
  <div id="tasks"></div>
  <div class="body">
    <aside>
      <div class="nav">
        <a data-v="missing" onclick="show('missing')"><div class="row"><span class="name">Faltan por descargar</span><span class="cnt mono" id="nMissing">–</span></div></a>
        <a data-v="organize" onclick="show('organize')"><div class="row"><span class="name">Listas para organizar</span><span class="cnt mono" id="nOrg">–</span></div></a>
        <a data-v="stats" onclick="show('stats')"><div class="row"><span class="name">Estadísticas</span><span class="cnt mono" id="nPct">–</span></div></a>
        <a data-v="mik" onclick="show('mik')"><div class="row"><span class="name">Sin Mixed In Key</span><span class="cnt mono" id="nMik">–</span></div></a>
        <a data-v="dups" onclick="show('dups')"><div class="row"><span class="name">Duplicados</span><span class="cnt mono" id="nDups">–</span></div></a>
        <a data-v="unify" onclick="show('unify')"><div class="row"><span class="name">Unificar repetidos</span><span class="cnt mono" id="nUni">–</span></div></a>
        <a data-v="conn" onclick="show('conn')"><div class="row"><span class="name">Conexiones</span><span class="cnt mono" id="nConn">–</span></div></a>
        <a data-v="rbchg" onclick="show('rbchg')"><div class="row"><span class="name">Cambios en Rekordbox</span><span class="cnt mono" id="nRb">–</span></div></a>
        <a data-v="hist" onclick="show('hist')"><div class="row"><span class="name">Historial</span><span class="cnt mono" id="nHist">–</span></div></a>
        <a data-v="rules" onclick="show('rules')"><div class="row"><span class="name">Reglas</span><span class="cnt mono" id="nRules">–</span></div></a>
        <a data-v="folders" onclick="show('folders')"><div class="row"><span class="name">Playlists nuevas</span><span class="cnt mono" id="nFolders">–</span></div></a>
        <a data-v="foreign" onclick="show('foreign')"><div class="row"><span class="name">Playlists de otros</span><span class="cnt mono" id="nForeign">–</span></div></a>
      </div>
      <h4 style="display:flex;align-items:center;justify-content:space-between">Tus playlists
        <button class="ghost ib" id="plReload" onclick="loadPlaylists()" title="Recargar la lista de playlists de Spotify (rápido, sin canciones)"></button></h4>
      <div style="padding:0 10px 6px"><select class="plsort" id="plSort" title="Ordenar tus playlists" onchange="setPlSort(this.value)"></select></div>
      <div class="nav" id="plNav"></div>
    </aside>
    <main id="main"></main>
  </div>
</div>

<div class="modal-bg" id="mbg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<div id="pvBar"><button class="pvp ib" id="pvPlay" onclick="pvToggle()" title="Reproducir / pausar (barra espaciadora)"></button>
  <div class="pvt"><b id="pvName"></b><span id="pvInfo"></span><input type="range" id="pvSeek" min="0" max="1000" value="0" oninput="pvSeekTo(this.value)"></div>
  <span class="mono" id="pvTime" style="font-size:12px;color:var(--mute);white-space:nowrap">0:00</span>
  <button class="ghost" onclick="pvJump(-15)" title="Atrás 15 s">−15</button><button class="ghost" onclick="pvJump(15)" title="Adelante 15 s">+15</button>
  <button class="ghost" id="pvDrop" onclick="pvPct(.5)" title="Ir a la mitad (donde suele estar el drop)">½</button>
  <button class="ghost ib" id="pvX" onclick="pvClose()" title="Cerrar"></button><audio id="pvAudio" preload="auto"></audio></div>
<div class="cmenu" id="cmenu"></div>

<script>
let S = {analysis:null, foreign:{}, settings:{}, connected:false, view:'missing', q:''};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const jsq = s => esc(JSON.stringify(String(s ?? '')));
const api = () => window.pywebview.api;
// rutas de Mac (/) y de Windows (\)
const short = p => { const h = S.home || ''; return (h && (p||'').startsWith(h)) ? '~' + p.slice(h.length) : (p||''); };
const base = p => (p||'').split(/[\\/]/).pop();
const folderOf = p => (p||'').split(/[\\/]/).slice(-2,-1)[0] || '';

// ---------- multitarea ----------
// Cada tarea del programa (analizar una playlist, organizar, unificar…) llega con su propio % por onTask.
// Varias pueden correr a la vez; las que mueven archivos esperan su turno ("en cola").
const T = {};   // clave -> {id,label,msg,pct,state}
const running = k => !!T[k];
window.onTask = ev => {
  if(ev.state==='done'){ if(T[ev.key] && T[ev.key].id===ev.id) delete T[ev.key]; }
  else {
    const t = T[ev.key] && T[ev.key].id===ev.id ? T[ev.key] : (T[ev.key] = {id:ev.id, label:ev.label, msg:'', pct:0, state:'start'});
    if(ev.msg) t.msg = ev.msg;
    if(ev.pct !== null && ev.pct !== undefined) t.pct = ev.pct;
    t.state = ev.state;
  }
  paintTasks();
};
function paintTasks(){
  const keys = Object.keys(T), box = $('tasks');
  box.classList.toggle('on', keys.length>0);
  $('prog').classList.toggle('busy', keys.length>0);
  if(keys.length) $('progTxt').textContent = keys.length===1 ? 'Trabajando…' : `${keys.length} tareas en curso`;
  box.innerHTML = keys.map(k => { const t=T[k];
    return `<div class="trow${t.state==='queued'?' queued':''}" data-key="${esc(k)}"><b>${esc(t.label)}</b><span class="tm">${esc(t.msg||'')}</span>
      <div class="pbar"><i style="width:${t.pct||0}%"></i></div><span class="tp mono">${t.state==='queued'?'–':(t.pct||0)+'%'}</span>
      ${t.state==='queued' ? `<button class="tx ib" title="Cancelar (todavía no empieza)" onclick="cancelTask(${jsq(k)})">${IC.x}</button>` : '<span class="tx"></span>'}</div>`; }).join('');
  // botones y tarjetas que muestran el % de su propia tarea
  document.querySelectorAll('[data-task]').forEach(el => {
    const t = T[el.dataset.task], kind = el.dataset.kind;
    if(kind==='btn'){ el.disabled = !!t; el.textContent = t ? `${el.dataset.busy||'Trabajando'} ${t.state==='queued'?'(en cola)':(t.pct||0)+'%'}` : el.dataset.idle; }
    else if(kind==='card' && t){ el.querySelector('.big').textContent=(t.pct||0)+'%'; el.querySelector('.pbar i').style.width=(t.pct||0)+'%'; if(t.msg) el.querySelector('.art:last-child').textContent=t.msg; }
  });
  const a = $('btnAnalyze'); if(a){ const t=T['analyze:all']; a.disabled=!!t; a.textContent = t?`Analizando ${t.pct||0}%`:'Analizar todo'; }
  const c = $('btnConn'); if(c) c.disabled = running('connect');
}
// Mensaje de estado para acciones cortas (no bloquea nada).
function busy(on, msg){ if(msg && !Object.keys(T).length) $('progTxt').textContent = msg; }
// Aplicar un análisis nuevo sin pisar uno más reciente que trajo otra tarea, y sin perder la vista actual.
async function applyAnalysis(r){
  if(r && r.spotify_paused !== undefined) S.spPause = r.spotify_paused;
  if(!r || !r.analysis) return;
  if(r.rev !== undefined && r.rev !== null && S.rev !== undefined && r.rev < S.rev){
    try{ const st = await api().get_state(S.rev ?? null); if(st.analysis && st.rev >= S.rev){ setAnalysis(st.analysis, st.rev); } }catch(e){}
    return;
  }
  setAnalysis(r.analysis, r.rev);
}
function setAnalysis(analysis, rev){
  const m = /^(pl|reorg):(\d+)$/.exec(S.view||''), id = m && S.analysis && S.analysis[+m[2]] ? S.analysis[+m[2]].id : null;
  S.analysis = analysis; if(rev !== undefined && rev !== null) S.rev = rev;
  if(id){ const i = analysis.findIndex(p=>p.id===id); S.view = i>=0 ? `${m[1]}:${i}` : 'missing'; if(m[1]==='reorg' && i>=0) RG.i = i; }
}
const plIdx = id => (S.analysis||[]).findIndex(p=>p.id===id);
async function cancelTask(k){
  const t = T[k]; const r = await api().cancel_task(k);
  toast(r.ok ? `Cancelando «${esc(t ? t.label : k)}»…` : esc(r.error), !r.ok);
}
function taskErr(r){ if(r.cancelled){ toast(esc(r.error)); return; } if(r.spotify_paused !== undefined){ S.spPause = r.spotify_paused; renderCore(); } if(r.dup) toast(esc(r.error)); else toast(esc(r.error), true); }
const warnHtml = r => (r && r.warnings && r.warnings.length) ? '<br><span style="color:var(--org)">' + r.warnings.map(esc).join('<br>') + '</span>' : '';
function toast(msg, err){ const t=$('toast'); t.innerHTML=msg; t.className='toast show'+(err?' err':''); clearTimeout(t._t); t._t=setTimeout(()=>t.className='toast', err?9000:5000); }
function modal(html){ $('modal').innerHTML = html; $('mbg').classList.add('show'); }
function closeModal(){ $('mbg').classList.remove('show'); }

// ---------- datos derivados ----------
// Se calculan UNA vez por análisis (con miles de canciones, recalcularlos en cada pintada congelaba la ventana).
let DC = {a: undefined};
function memo(key, fn){ if(DC.a !== S.analysis) DC = {a: S.analysis}; return key in DC ? DC[key] : (DC[key] = fn()); }
function allRows(){ return memo('rows', () => (S.analysis||[]).flatMap(pl => pl.tracks.map(t => ({...t, pl})))); }
function missingUnique(){
  return memo('missing', () => {
    const m = new Map();
    for (const r of allRows()) if (r.status==='missing'){
      if(!m.has(r.id)) m.set(r.id, {...r, pls:[]});
      m.get(r.id).pls.push(r.pl);
    }
    return [...m.values()];
  });
}
// movimientos únicos (un archivo por canción) + descargas repetidas
// pid opcional: solo esa playlist
function rowsOf(pid){
  if(!pid) return allRows();
  return memo('rows:'+pid, () => { const pl=(S.analysis||[]).find(p=>p.id===pid); return pl ? pl.tracks.map(t=>({...t, pl})) : []; });
}
function toOrganize(pid){ return memo('org:'+(pid||''), () => { const seen=new Set(); return rowsOf(pid).filter(r => r.status==='inbox' && !seen.has(r.source) && seen.add(r.source)); }); }
function dupList(pid){ return memo('dup:'+(pid||''), () => { const moves=new Set(toOrganize(pid).map(r=>r.source)); const m=new Map();
  for(const r of rowsOf(pid)) for(const d of (r.inbox_dups||[])) if(!moves.has(d) && !m.has(d)) m.set(d, r); return [...m].map(([path,r])=>({path,r})); }); }
function orgAvail(){ return (S.inboxCount||0) > 0 || orgCount() > 0; }
function orgCount(pid){ return S.analysis ? toOrganize(pid).length + dupList(pid).length : 0; }
const changed = pl => !pl.pending && pl.snapshot && pl.analyzed_snapshot && pl.snapshot !== pl.analyzed_snapshot;
function counts(pl){ const c={ok:0,elsewhere:0,inbox:0,missing:0}; pl.tracks.forEach(t=>c[t.status]=(c[t.status]||0)+1); return c; }
function match(r){ if(!S.q) return true; const q=S.q.toLowerCase().trim();
  if(/^\d{1,2}[ab]$/.test(q)) return (r.key||'').toLowerCase()===q;  // buscar «8A» = canciones en esa key
  return (r.name+' '+r.artists.join(' ')+' '+(r.key||'')).toLowerCase().includes(q); }
// ---------- key (Camelot) y energía: lo que dejó Mixed In Key ----------
const CAM_HUE = n => ((n-1)*30 + 150) % 360;
function keyChip(r){
  if(!r.key) return r.source ? '<span class="art" title="Sin key: pásala por Mixed In Key">—</span>' : '';
  const n = parseInt(r.key), minor = r.key.endsWith('A');
  return `<span class="kc mono" style="background:hsl(${CAM_HUE(n)} 70% ${minor?38:48}% / .9)" title="${r.mik?'Key de Mixed In Key':'Key de otro programa (no de MIK)'}">${esc(r.key)}${r.mik?'':'<sup>*</sup>'}</span>`;
}
function energyBar(e){
  if(!e) return '';
  return `<span class="eb" title="Energía ${e} de 10"><i style="width:${e*10}%;background:hsl(${120-e*12} 75% 52%)"></i></span><span class="mono" style="font-size:11.5px;color:var(--mute)">${e}</span>`;
}
const camRank = k => { const m=/^(\d+)([AB])$/.exec(k||''); return m ? (+m[1])*2 + (m[2]==='B'?1:0) : 999; };

// ---------- carpetas nuevas en tu carpeta de playlists -> ¿importarlas como playlist? ----------
let FD = {data:null};
async function fdLoad(){ try{ const r = await api().folders(); if(r.ok){ FD.data = r; S.spQueue = (r.queue||[]).length; if(S.view==='folders') render(); else renderCore(); } }catch(e){} }
window.onNewFolders = list => {
  fdLoad();
  if($('mbg').classList.contains('show')){  // ya hay una ventana abierta: solo avisar
    toast(`✨ Nueva: <b>${list.map(f=>esc(f.name)).join(', ')}</b>. <a class="lnk" onclick="show('folders')">¿Importarla?</a>`);
    return;
  }
  fdAsk(list[0], list.slice(1));
};
function fdPlatformOptions(sp){
  const why = !sp.connected ? 'conecta Spotify primero' : !sp.can_write ? 'reconecta Spotify para dar permiso de crear playlists' : '';
  const pausa = sp.paused && sp.paused*1000 > Date.now();
  const hora = pausa ? new Date(sp.paused*1000).toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'}) : '';
  return [
    ['spotify', '🟢 Spotify', pausa
      ? `⏳ Spotify está en pausa por exceso de consultas (hasta las ${hora}). La importo ya en BrainOrder y la paso a Spotify sola en cuanto se pueda: no tienes que hacer nada más.`
      : 'Se crea en tu cuenta y busco cada canción (por ISRC o artista + título). Te digo cuáles no encontré.', why],
    ['otra', '🎵 Deezer, Apple Music, Tidal, SoundCloud u otra', 'Esas plataformas no dejan que una app personal cree playlists: te dejo un archivo listo para importarla con TuneMyMusic o Soundiiz (2 clics). En BrainOrder queda como playlist.', ''],
    ['ninguna', '💻 Ninguna', 'Solo en BrainOrder y tus programas de DJ.', ''],
  ];
}
async function fdAsk(f, rest){
  if(!FD.data) await fdLoad();
  const sp = (FD.data && FD.data.spotify) || {};
  const opts = fdPlatformOptions(sp), def = opts[0][3] ? 'ninguna' : 'spotify';
  const dj = f.kind === 'dj', n = f.count ?? 0;
  const what = dj ? `Playlist nueva en ${esc(f.label)}: «${esc(f.name)}»` : `Carpeta nueva: «${esc(f.name)}»`;
  const desc = dj ? `Tiene <b>${n}</b> ${n===1?'canción':'canciones'}. ¿La importo como playlist de BrainOrder?`
    : (n ? `Tiene <b>${n}</b> ${n===1?'canción':'canciones'} y todavía no es una playlist. ¿La importo como playlist?`
         : `Está vacía. Si la importo, la playlist se llena sola con lo que vayas poniendo en la carpeta.`);
  FD.cur = f;
  modal(`<h3>${dj?'🎛️':'📁'} ${what}</h3>
    <p>${desc}</p>
    ${dj ? '' : `<div class="art" style="margin:-4px 0 10px">${esc(short(f.path))}</div>`}
    <div style="font-weight:650;margin:8px 0 6px">¿También en qué plataforma?</div>
    ${opts.map(([v,t,d,dis])=>`<label class="opt" style="display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:${dis?'not-allowed':'pointer'};opacity:${dis?.5:1}">
      <input type="radio" name="fdp" value="${v}" ${v===def?'checked':''} ${dis?'disabled':''} style="margin-top:3px">
      <span><b>${t}</b><br><span class="art">${esc(d)}${v==='spotify'&&!n&&!dj?' Se crea vacía: lo que agregues después a la carpeta no pasa solo a Spotify.':''}${dis?` <i>(${esc(dis)})</i>`:''}</span></span></label>`).join('')}
    ${fdCanMove(f) ? `<div style="font-weight:650;margin:12px 0 6px">¿Paso sus archivos a tu carpeta de playlists?</div>
    <label class="opt" style="display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:pointer">
      <input type="radio" name="fdm" value="1" checked style="margin-top:3px"><span><b>Sí, moverlos a <code>${esc(short(S.settings.dest_root))}/${esc(f.name)}</code></b><br>
      <span class="art">Quedan junto a tus otras playlists. ${dj?'Si alguna canción también está en otra playlist, se mueve igual (Reorganizar la puede devolver). ':''}Se corrigen sus rutas en Rekordbox y tus otros programas (cerrados) y se puede deshacer en Historial.${dj?'':' Si la carpeta vieja queda vacía, se elimina.'}</span></span></label>
    <label class="opt" style="display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:pointer">
      <input type="radio" name="fdm" value="0" style="margin-top:3px"><span><b>No, dejarlos donde están</b></span></label>` : ''}
    <label style="display:flex;gap:8px;align-items:center;margin-top:10px;cursor:pointer"><input type="checkbox" id="fdDj" ${n?'checked':''}> Pasarla ya a ${dj?'mis otros programas de DJ':'mis programas de DJ (Rekordbox, Traktor…)'}</label>
    ${rest && rest.length ? `<div class="art" style="margin-top:8px">Hay ${rest.length} más por decidir: las ves en «Playlists nuevas».</div>` : ''}
    <div class="actions"><button class="ghost" onclick="fdNever()">No preguntar por esta</button>
      <button onclick="closeModal()">Ahora no</button><button class="primary" onclick="fdImport()">Importar</button></div>`);
}
function fdCanMove(f){
  if(f.kind === 'dj') return !!(f.count ?? 0);
  const r = (S.settings.dest_root||'').replace(/[\\/]+$/,'');
  return dirOf(f.path) !== r;                    // ya está en tu carpeta de playlists
}
// canciones nuevas en una carpeta que importaste a Spotify -> ¿a la misma playlist?
window.onLinkedAdded = list => {
  const x = list[0]; if(!x) return;
  if($('mbg').classList.contains('show')){ toast(`🎵 Agregaste ${x.count} canción(es) a «${esc(x.name)}». <a class="lnk" onclick="lkAsk(${esc(JSON.stringify(x))})">¿Las paso a Spotify?</a>`); return; }
  lkAsk(x);
};
function lkAsk(x){
  modal(`<h3>🎵 Canciones nuevas en «${esc(x.name)}»</h3>
    <p>Agregaste <b>${x.count}</b> ${x.count===1?'canción':'canciones'} a la carpeta. ¿Las agrego también a tu playlist <b>«${esc(x.name)}»</b> de Spotify?</p>
    <div class="box">${x.files.map(esc).join('<br>')}${x.count>x.files.length?'<br>…':''}</div>
    <div class="art">Se agregan a la misma playlist (nunca se crea otra) y solo las que no estén ya.</div>
    <div class="actions"><button onclick="lkDo(${jsq(x.path)}, false)">No, solo en la carpeta</button><button class="primary" onclick="lkDo(${jsq(x.path)}, true)">Agregar a Spotify</button></div>`);
}
async function lkDo(path, add){
  closeModal();
  const r = await api().link_add(path, add);
  if(!r.ok){ taskErr(r); return; }
  if(r.analysis) { await applyAnalysis(r); render(); }
  if(r.queued){ S.spQueue = (S.spQueue||0) + 1; renderCore(); toast(`⏳ Spotify está en pausa: las ${r.queued.count} canción(es) nuevas de «${esc(r.name)}» se agregan solas a la playlist en cuanto Spotify lo permita.`); return; }
  if(add) toast(`✅ ${r.added} canción(es) agregadas a «${esc(r.name)}» en Spotify.` + (r.unresolved.length?`<br><span style="color:var(--org)">No encontré ${r.unresolved.length}: ${r.unresolved.slice(0,4).map(esc).join(', ')}</span>`:''));
}
async function fdNever(){
  const f = FD.cur; closeModal();
  if(f.kind === 'dj') await api().dj_dismiss(f.program, f.ref, true); else await api().folder_dismiss(f.path, true);
  fdLoad(); toast('Listo: no te vuelvo a preguntar por esa. La puedes importar cuando quieras desde «Playlists nuevas».');
}
async function fdDismiss(path, forever){ await api().folder_dismiss(path, !!forever); fdLoad(); }
async function fdImport(){
  const f = FD.cur;
  const plat = (document.querySelector('input[name=fdp]:checked')||{}).value || 'ninguna';
  const dj = $('fdDj') && $('fdDj').checked;
  closeModal();
  toast(plat==='spotify' && !(S.spPause && S.spPause*1000 > Date.now()) ? 'Importando: buscando sus canciones en Spotify… puedes seguir usando la app.' : 'Importando…');
  const mv = document.querySelector('input[name=fdm]:checked');
  const o = {spotify: plat==='spotify', csv: plat==='otra', move: !!(mv && mv.value==='1')};
  const r = f.kind === 'dj' ? await api().dj_import(f.program, f.ref, o) : await api().folder_import(f.path, o);
  if(!r.ok){ taskErr(r); fdLoad(); return; }
  await applyAnalysis(r); fdLoad();
  const x = r.result; let msg = `✅ «${esc(x.name)}» ahora es una playlist (${x.files} ${x.files===1?'canción':'canciones'}).`;
  if(x.move){ msg += `<br>📁 ${x.move.moved} archivo${x.move.moved!==1?'s':''} pasado${x.move.moved!==1?'s':''} a <code>${esc(short(x.move.dest))}</code>` + (x.move.already?` (${x.move.already} ya estaban ahí)`:'') + '.';
    if(x.move.skipped && x.move.skipped.length) msg += `<br><span style="color:var(--org)">${x.move.skipped.length} no se movieron: ${x.move.skipped.slice(0,3).map(k=>esc(k.file+' ('+k.why+')')).join('; ')}</span>`;
    if(x.move.op_id) msg += undoLink({op_id: x.move.op_id}); loadHist(); }
  if(x.queued) msg += `<br>⏳ Spotify está en pausa: la paso a Spotify sola en cuanto lo permita${x.queued.until?` (desde las ${new Date(x.queued.until*1000).toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'})})`:''}. Mientras tanto ya funciona aquí y en tus programas de DJ.`;
  if(x.spotify_reused) msg += `<br>Ya tenías «${esc(x.name)}» en Spotify: usé esa misma playlist (no creé otra).`;

  return memo('mik', () => {
    const by = new Map();
    for(const pl of S.analysis||[]){
      if(pl.pending || pl.ignored) continue;
      for(const r of pl.tracks){
        if(!r.source || r.mik) continue;
        let x = by.get(r.source);
        if(!x){ x = {source:r.source, id:r.id, name:r.name, artists:r.artists||[], key:r.key, bpm:r.bpm, status:r.status, pls:[]}; by.set(r.source, x); }

    }
    return [...by.values()].sort((a,b) => (a.artists[0]||'').localeCompare(b.artists[0]||'', 'es') || a.name.localeCompare(b.name, 'es'));
  });
}

const cmpNorm = s => (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()
  .replace(/\s*[\(\[]?\s*(feat\.?|ft\.?|featuring|con)\s+[^\)\]]*[\)\]]?/g,' ').replace(/[^a-z0-9]+/g,'');
// una canción se reconoce por su id, su ISRC, el mismo archivo o el mismo artista + título (sin tildes ni «feat.»)
function cmpKeys(r){
  const k = ['id:'+r.id];
  if(r.isrc) k.push('isrc:'+r.isrc.toUpperCase());
  if(r.source) k.push('src:'+r.source);
  const t = cmpNorm(r.name), a = cmpNorm((r.artists||[])[0]);
  if(t) k.push('at:'+a+'|'+t);
  return k;
}
function cmpRun(A, B){
  return memo('cmp:'+A.id+':'+B.id, () => {
    const idx = new Map(); B.tracks.forEach((r,j) => cmpKeys(r).forEach(k => { if(!idx.has(k)) idx.set(k, j); }));
    const usedB = new Set(), both = [], onlyA = [];
    for(const r of A.tracks){
      let j; for(const k of cmpKeys(r)){ const x = idx.get(k); if(x!==undefined && !usedB.has(x)){ j = x; break; } }
      if(j===undefined) onlyA.push(r); else { usedB.add(j); both.push([r, B.tracks[j]]); }
    }
    const onlyB = B.tracks.filter((r,j) => !usedB.has(j));
    const have = r => (r.status==='ok'||r.status==='elsewhere'||r.status==='inbox') && r.source;
    const arts = pl => { const m = new Map(); for(const r of pl.tracks) for(const a of (r.artists||[])){ const k = cmpNorm(a); if(k && !m.has(k)) m.set(k, a); } return m; };
    const aa = arts(A), ab = arts(B), cA = new Map();
    for(const r of A.tracks) for(const a of (r.artists||[])){ const k = cmpNorm(a); if(ab.has(k)) cA.set(k, (cA.get(k)||0)+1); }
    const shared = [...cA.entries()].sort((x,y)=>y[1]-x[1]).map(([k]) => aa.get(k));
    const bpm = pl => { const v = pl.tracks.map(r=>+r.bpm).filter(x=>x>0); return v.length ? Math.round(v.reduce((s,x)=>s+x,0)/v.length) : null; };

      pA: A.tracks.length ? Math.round(both.length/A.tracks.length*100) : 0, pB: B.tracks.length ? Math.round(both.length/B.tracks.length*100) : 0,
      bothHave: both.filter(([x,y]) => have(x)||have(y)).length, shared, artA: aa.size, artB: ab.size,

}

function plResult(x){
  let m = '';
  const f = x.files || x.move;
  if(f && f.kept) m += `<br>📁 Los archivos se quedaron en <code>${esc(short(f.kept))}</code>.`;
  else if(f && f.moved !== undefined){
    if(x.move) m += `<br>📁 ${f.moved} archivo(s) en <code>${esc(short(f.to))}</code>.`;
    else m += `<br>📁 ${f.moved} archivo(s) ordenados` + (f.home?` · ${f.home} a otras playlists`:'') + (f.dup?` · ${f.dup} repetidas a <code>_duplicados</code>`:'') + (f.rest && !x.into?` · ${f.rest} a <code>${esc(short(f.rest_dir))}</code>`:'') + '.';
    if(f.skipped && f.skipped.length) m += `<br><span style="color:var(--org)">${f.skipped.length} no se movieron: ${f.skipped.slice(0,3).map(k=>esc(k.file+' ('+k.why+')')).join('; ')}</span>`;
    m += undoLink(f);
  }
  const lo = f && f.leftover;
  if(lo) m += `<br><span style="color:var(--org)">Quedaron ${lo.count} archivo(s) en <code>${esc(short(lo.path))}</code> que no se pudieron mover${lo.files&&lo.files.length?` (${lo.files.map(esc).join(', ')})`:''}. Esa carpeta ya no aparece como «playlist nueva».</span> <a class="lnk" onclick="reveal(${jsq(lo.path)})">Abrir</a>`;
  const dj = Object.values(x.dj||{});
  if(dj.length) m += `<br>🎛️ ${dj.map(d => esc(d.label)).join(', ')}: listo` + (dj.some(d=>d.backup)?' (con respaldo)':'') + '.';
  for(const w of (x.dj_warnings||[])) m += `<br><span style="color:var(--org)">${esc(w)}</span>`;
  if(x.spotify) m += x.spotify.state==='queued' ? `<br>⏳ Spotify está en pausa: el cambio se hace solo en cuanto lo permita.` : `<br>🟢 Spotify: listo${x.spotify.added!==undefined?` (${x.spotify.added} canciones agregadas)`:''}.`;
  if(x.platform_untouched) m += `<br><span class="art">${esc(x.platform_untouched)} no deja cambiarla desde aquí: el cambio quedó en BrainOrder y tus programas.</span>`;
  if(x.origin_untouched) m += `<br><span class="art">La playlist original en ${esc(x.origin_untouched)} no se tocó.</span>`;
  return m;
}

function songMenu(r, pl){
  const label = (r.artists && r.artists.length ? r.artists.join(', ') + ' - ' : '') + r.name;
  const it = [['#', label], [r.source ? '▶ Escuchar' : '▶ Escuchar 30 s (Deezer)', () => pvPlay(r)]];
  if(r.source && !r.mik) it.push(['🎹 Mandar a Mixed In Key', async () => { MK.sel = new Set([r.source]); await mikSend(); }]);
  const finder = S.win ? 'Mostrar en el Explorador' : 'Mostrar en Finder';
  if(pl && r.source && (r.status==='ok' || r.status==='elsewhere')){
    const cur = dirOf(r.source), seen = new Set([cur]);
    const mv = (dest, txt, tip) => { if(!dest || seen.has(dest)) return; seen.add(dest); it.push([txt, () => ctxMove(pl, r, dest), false, tip]); };
    mv(r.dest_dir, `📁 Mover a su carpeta «${r.home_name || base(r.dest_dir)}»`, 'La carpeta de la primera playlist donde aparece (según tu prioridad en Reglas)');
    mv(pl.folder, `📂 Mover a esta playlist «${pl.name}»`);
    // otras playlists que también tienen esta canción
    const otras = []; for(const p of S.analysis||[]) if(p !== pl && !p.pending && p.tracks.some(t => t.id === r.id)) otras.push(p);
    otras.slice(0, 8).forEach(p => mv(p.folder, `♫ Mover a «${p.name}»`, 'También está en esa playlist'));
    it.push(['📁 Mover a otra carpeta…', () => ctxMovePick(pl, r)]);
    it.push('-');
    it.push(S.pinned.has(r.source)
      ? ['📌 Soltar: que Reorganizar la vuelva a proponer', () => ctxPin(r.source, false)]
      : ['📌 Dejarla fija aquí (Reorganizar no la propone)', () => ctxPin(r.source, true)]);
    it.push(['🔍 ' + finder, () => reveal(r.source)]);
  } else if(r.status === 'inbox' && r.source){
    if(pl) it.push([`⬇ Organizar las descargas de «${pl.name}»`, () => askOrganize(pl.id)]);
    it.push(['🔍 ' + finder, () => reveal(r.source)]);
  } else {
    if(r.url) it.push(['🎧 Abrir en ' + hostLabel(r.url), () => openUrl(r.url)]);
    if(r.deezer && r.deezer.url) it.push([r.deezer.found ? '🎵 Abrir en Deezer' : '🎵 Buscar en Deezer', () => openUrl(r.deezer.url)]);
    if(r.dest_dir) it.push([`📁 Abrir la carpeta donde irá «${r.home_name || base(r.dest_dir)}»`, () => reveal(r.dest_dir)]);
  }
  // playlist de carpeta: la canción ya no está en su carpeta (la borraste por repetida) pero la playlist la recuerda
  if(pl && r.kept)
    it.push(['➖ Quitar de esta playlist', () => ctxForget(pl, r), false, 'La playlist la recuerda aunque borraste el archivo de su carpeta (usa la otra copia). Esto la quita de la playlist; no toca ningún archivo.']);
  it.push(['📋 Copiar «' + label + '»', async () => { const x = await api().copy_text(label); toast(x.ok ? 'Copiado.' : esc(x.error), !x.ok); }]);
  return it;
}

// ---------- orden de la lista de playlists ----------
const PL_SORTS = [['spotify','Orden de Spotify'],['missing_desc','Más faltantes primero'],['missing_asc','Menos faltantes primero'],
  ['complete','Completas primero'],['incomplete','Menos completas primero'],['organize','Con descargas por organizar'],
  ['name','Nombre (A–Z)'],['size','Más canciones primero'],['created_desc','Creadas más recientemente'],['created_asc','Creadas hace más tiempo'],
  ['updated_desc','Con canciones agregadas hace poco']];
function paintPlSort(){ const el=$('plSort'); if(!el) return;
  if(!el.options.length) el.innerHTML = PL_SORTS.map(([v,t])=>`<option value="${v}">${t}</option>`).join('');
  el.value = PREF.pl_sort || 'spotify'; }
function setPlSort(v){ savePref('pl_sort', v); renderCore(); }
function plOrder(a){
  const k = PREF.pl_sort || 'spotify', items = a.map((pl,i)=>[pl,i]);
  if(k==='spotify') return items;
  // las sin analizar e ignoradas siempre al final (no tienen números que comparar)
  const done = items.filter(([p])=>!p.pending && !p.ignored), rest = items.filter(([p])=>p.pending || p.ignored);
  const st = p => plStats(p), name = p => (p.name||'').toLowerCase();
  const f = {
    missing_desc: (x,y) => st(y).missing - st(x).missing || st(y).inbox - st(x).inbox,
    missing_asc:  (x,y) => st(x).missing - st(y).missing || st(y).pct - st(x).pct,
    complete:     (x,y) => st(y).pct - st(x).pct || st(y).total - st(x).total,
    incomplete:   (x,y) => st(x).pct - st(y).pct || st(y).missing - st(x).missing,
    organize:     (x,y) => orgCount(y.id) - orgCount(x.id) || st(y).missing - st(x).missing,
    name:         (x,y) => name(x).localeCompare(name(y), 'es'),
    created_desc: (x,y) => (y.created||'').localeCompare(x.created||''),
    created_asc:  (x,y) => (x.created||'9999').localeCompare(y.created||'9999'),
    updated_desc: (x,y) => (y.updated||y.created||'').localeCompare(x.updated||x.created||''),
    size:         (x,y) => st(y).total - st(x).total,
  }[k];
  done.sort(([x,i],[y,j]) => f(x,y) || i-j);
  if(k==='name') rest.sort(([x],[y]) => name(x).localeCompare(name(y), 'es'));
  return done.concat(rest);
}

// Tablas largas: se pintan de a LIM filas (pintar 6.000 de golpe congelaba la ventana)
const LIM_STEP = 400;
let LIM = {view:null, n:LIM_STEP};
function limRows(rows){
  if(LIM.view !== S.view + '|' + (S.q||'') + '|' + SO.filter){ LIM = {view: S.view + '|' + (S.q||'') + '|' + SO.filter, n: LIM_STEP}; }
  return rows.length > LIM.n ? rows.slice(0, LIM.n) : rows;
}
function moreRows(total, cols){
  if(total <= LIM.n) return '';
  return `<tr><td colspan="${cols}" style="text-align:center;padding:14px"><span class="art">Mostrando ${LIM.n} de ${total}.</span>
    <button onclick="LIM.n+=${LIM_STEP};renderTable()">Mostrar ${Math.min(LIM_STEP, total-LIM.n)} más</button>
    <button class="ghost" onclick="LIM.n=${total};renderTable()">Mostrar todas</button></td></tr>`;
}
function renderTable(){
  const t = $('tbl'); if(!t) return;
  let html='';
  if(S.view==='missing'){
    const rows = missingUnique().filter(match);
    if(!rows.length){ t.innerHTML = `<div class="empty"><h3>No te falta nada 🎉</h3></div>`; return; }
    html = `<table><tr><th>#</th><th>Canción</th><th>Irían en</th><th></th></tr>` + limRows(rows).map((r,i)=>`<tr data-mid="${esc(r.id)}">
      <td class="mono" style="color:var(--mute)">${i+1}</td>

      <td><span class="chip" onclick="reveal(${jsq(r.dest_dir)})" title="${esc(short(r.dest_dir))}">📁 ${esc(r.home_name)}</span>${r.pls.filter(p=>p.name!==r.home_name).map(p=>`<span class="chip" style="opacity:.7">♫ ${esc(p.name)}</span>`).join('')}</td>
      <td style="white-space:nowrap">${links(r)}</td></tr>`).join('') + moreRows(rows.length, 4) + `</table>`;
  } else if(S.view==='organize'){
    const rows = toOrganize().filter(match), dups = dupList().filter(d=>match(d.r));
    if(!rows.length && !dups.length){ t.innerHTML = `<div class="empty"><h3>Nada por organizar</h3><p>Descarga canciones a tu carpeta de descargas y vuelve a Analizar.</p></div>`; return; }
    if(rows.length) html += `<table><tr><th>Canción</th><th>En descargas</th><th>Se mueve a</th></tr>` + rows.map(r=>`<tr>
      <td><div>${esc(r.name)}</div><div class="art">${esc(r.artists.join(', '))}</div></td>
      <td><div class="path" onclick="reveal(${jsq(r.source)})">${esc(base(r.source))}</div></td>
      <td><span class="chip" onclick="reveal(${jsq(r.dest_dir)})">📁 ${esc(r.home_name)}</span></td></tr>`).join('') + `</table>`;
    if(dups.length) html += `<div class="vhead" style="margin-top:26px"><h2 style="font-size:17px">Descargas repetidas</h2><span class="sub">Ya tienes estas canciones; se apartan en <code>_duplicados</code> para que las borres.</span></div>
      <table><tr><th>Archivo descargado</th><th>Ya la tienes en</th></tr>` + dups.map(d=>`<tr>
      <td><div class="path" onclick="reveal(${jsq(d.path)})">${esc(base(d.path))}</div></td>
      <td><div class="path" onclick="reveal(${jsq(d.r.source)})">${esc(short(d.r.source))}</div></td></tr>`).join('') + `</table>`;
  } else {
    const pl = S.analysis[+S.view.split(':')[1]];
    const lab = {here:'Aquí', elsewhere:'En otra carpeta', inbox:'En descargas', missing:'Falta'};
    const cls = {here:'ok', elsewhere:'elsewhere', inbox:'inbox', missing:'missing'};
    const ds = r => (r.status==='ok'||r.status==='elsewhere') ? (dirOf(r.source)===pl.folder?'here':'elsewhere') : r.status;
    // filtro por estado (chips con conteo) + orden por columna
    const cnt = {all:pl.tracks.length, here:0, elsewhere:0, inbox:0, missing:0, nomik:0};
    pl.tracks.forEach(r=>{ cnt[ds(r)]++; if(r.source && !r.mik) cnt.nomik++; });
    if(SO.filter!=='all' && !cnt[SO.filter]) SO.filter='all';
    let rows = pl.tracks.filter(match).filter(r => SO.filter==='all' || (SO.filter==='nomik' ? (r.source && !r.mik) : ds(r)===SO.filter));
    const rank = {missing:0, inbox:1, elsewhere:2, here:3};
    const key = {
      pos: r => r.pos,
      name: r => (r.name||'').toLowerCase(),
      artist: r => (r.artists[0]||'').toLowerCase(),
      status: r => rank[ds(r)]*1e5 + r.pos,
      file: r => (r.source ? short(r.source) : '\uffff').toLowerCase(),
      key: r => camRank(r.key)*1e5 + r.pos,
      energy: r => (r.energy ? 11-r.energy : 99)*1e5 + r.pos,
      bpm: r => (r.bpm || 999)*1e5 + r.pos,
    }[SO.col] || (r=>r.pos);
    rows = rows.slice().sort((a,b)=>{ const x=key(a), y=key(b); return (x<y?-1:x>y?1:0) * SO.dir; });
    const chip = (k,t) => cnt[k]||k==='all' ? `<button class="chipf ${SO.filter===k?'on':''} ${k}" onclick="SO.filter='${k}';renderTable()">${t} <span class="mono">${cnt[k]}</span></button>` : '';
    const th = (c,t,extra='') => `<th class="sortable ${SO.col===c?'on':''}" onclick="sortBy('${c}')" ${extra}>${t}${SO.col===c?(SO.dir>0?' ▲':' ▼'):''}</th>`;
    html = `<div class="chips">${chip('all','Todas')}${chip('missing','Falta')}${chip('inbox','En descargas')}${chip('elsewhere','En otra carpeta')}${chip('here','Aquí')}${cnt.nomik?`<span style="width:1px;background:var(--line);margin:0 4px"></span>${chip('nomik','Sin Mixed In Key')}`:''}</div>
      <table><tr>${th('pos','#')}${th('name','Canción')}${th('key','Key')}${th('energy','Energía')}${th('bpm','BPM')}${th('status','Estado')}${th('file','Archivo')}</tr>` + (rows.length? limRows(rows).map(r=>`<tr data-pos="${r.pos}" ${r.source?'data-src="1"':''}>
      <td class="mono" style="color:var(--mute)">${r.pos+1}</td>
      <td><div style="display:flex;align-items:flex-start">${pvBtn(r)}<div><div>${esc(r.name)}</div><div class="art">${esc(r.artists.join(', '))}</div></div></div></td>
      <td>${keyChip(r)}</td>
      <td style="white-space:nowrap">${energyBar(r.energy)}</td>
      <td class="mono" style="color:var(--mute)">${r.bpm?Math.round(r.bpm):''}</td>
      <td><span class="st ${cls[ds(r)]}">${lab[ds(r)]}</span></td>
      <td>${r.source?`<div class="path" onclick="reveal(${jsq(r.source)})">${esc(short(r.source))}</div>`:links(r)}</td></tr>`).join('') + moreRows(rows.length, 7)
      : `<tr><td colspan="7" class="art" style="padding:24px;text-align:center">Ninguna canción con ese filtro.</td></tr>`) + `</table>`
      + `<div class="art" style="margin-top:8px">Clic derecho en una canción: moverla a otra carpeta, fijarla, mostrarla en ${S.win?'el Explorador':'Finder'}…</div>`
      + `<div class="art" style="margin-top:8px">Key y energía salen de las etiquetas que deja Mixed In Key (Camelot). <sup>*</sup> = key de otro programa. Escribe <b>8A</b> en el buscador para ver solo esa key.</div>`;
  }
  t.innerHTML = html;
}

// ---------- estadísticas ----------
const dirOf = p => (p||'').replace(/[\\/][^\\/]*$/, '');
function plStats(pl){ return memo('ps:'+pl.id, () => plStats0(pl)); }
function plStats0(pl){
  const c={total:pl.tracks.length, here:0, other:0, inbox:0, missing:0};
  for(const r of pl.tracks){
    if((r.status==='ok'||r.status==='elsewhere') && r.source){ dirOf(r.source)===pl.folder ? c.here++ : c.other++; }
    else if(r.status==='inbox') c.inbox++; else c.missing++;
  }
  c.pct = c.total ? Math.round((c.here+c.other)/c.total*100) : 100; return c;
}
function globalStats(){ return memo('gs', globalStats0); }
function globalStats0(){
  const songs=new Map(), files=new Set(); let refs=0;
  for(const r of allRows()){ songs.set(r.id, r.status); if((r.status==='ok'||r.status==='elsewhere') && r.source){ refs++; files.add(r.source); } }
  const vals=[...songs.values()], owned=vals.filter(v=>v==='ok'||v==='elsewhere').length;
  return {songs:songs.size, owned, inbox:vals.filter(v=>v==='inbox').length, missing:vals.filter(v=>v==='missing').length,
          files:files.size, saved:refs-files.size, pct: songs.size?Math.round(owned/songs.size*100):100};
}
function mikStats(){ return memo('mik', () => { const seen=new Set(); let owned=0, mik=0;
  for(const r of allRows()) if(r.source && !seen.has(r.source)){ seen.add(r.source); owned++; if(r.mik) mik++; }
  return {owned, mik, pct: owned? Math.round(mik/owned*100) : 0}; }); }
function statsView(){
  const g = globalStats();
  const rows = S.analysis.map((pl,i)=>({pl,i,c:plStats(pl)})).filter(x=>!x.pl.pending).sort((a,b)=>a.c.pct-b.c.pct);
  const origins = new Map();
  for(const r of allRows()) if((r.status==='ok'||r.status==='elsewhere') && r.source) origins.set(dirOf(r.source), (origins.get(dirOf(r.source))||new Set()).add(r.source));
  const top = [...origins].map(([d,set])=>[d,set.size]).sort((a,b)=>b[1]-a[1]).slice(0,12), max = top.length?top[0][1]:1;
  return `<div class="cards">
      <div class="card"><div class="k">Canciones únicas</div><div class="v mono">${g.songs}</div></div>
      <div class="card ok"><div class="k">Biblioteca completa</div><div class="v mono">${g.pct}%</div></div>
      <div class="card"><div class="k">Archivos en disco</div><div class="v mono">${g.files}</div></div>
      <div class="card ok"><div class="k">Duplicados evitados</div><div class="v mono">${g.saved}</div></div>
      <div class="card" title="Canciones que ya tienes con key y energía de Mixed In Key. En cada playlist, el filtro «Sin Mixed In Key» muestra las que faltan."><div class="k">Con Mixed In Key</div><div class="v mono">${mikStats().pct}%</div><div class="art">${mikStats().mik}/${mikStats().owned}</div></div></div>
    <div class="vhead"><h2>Por playlist</h2><span class="sub">Aquí = el archivo está en la carpeta de la playlist · Otra carpeta = se usa desde donde está (ver el .txt de la carpeta).</span>
      <div class="sp"><button class="xl" onclick="exportAllPlaylists()">📊 Informes de todas (uno por playlist)</button></div></div>
    <table><tr><th>Playlist</th><th style="width:30%">Completa</th><th class="mono">Total</th><th>Aquí</th><th>Otra carpeta</th><th>Descargas</th><th>Faltan</th><th></th></tr>
    ${rows.map(({pl,i,c})=>{ const n=c.total||1; return `<tr>
      <td><a class="lnk" style="color:var(--text);font-size:13.5px" onclick="show('pl:${i}')">${pl.liked?'♥ ':''}${esc(pl.name)}</a></td>
      <td><div style="display:flex;align-items:center;gap:8px"><div class="bar" style="flex:1;margin:0;height:7px">
        <i style="width:${c.here/n*100}%;background:var(--ok)"></i><i style="width:${c.other/n*100}%;background:var(--info)"></i><i style="width:${c.inbox/n*100}%;background:var(--org)"></i><i style="width:${c.missing/n*100}%;background:var(--miss)"></i></div>
        <span class="mono" style="width:40px;text-align:right">${c.pct}%</span></div></td>
      <td class="mono">${c.total}</td><td class="mono" style="color:var(--ok)">${c.here}</td><td class="mono" style="color:var(--info)">${c.other}</td>
      <td class="mono" style="color:var(--org)">${c.inbox}</td><td class="mono" style="color:var(--miss)">${c.missing}</td>
      <td style="white-space:nowrap">${pl.report?`<a class="lnk" onclick="reveal(${jsq(pl.report)})">📄 .txt</a>`:'<span class="art">completa</span>'}
        <span style="color:var(--line)"> · </span><a class="lnk" style="color:#34d399" onclick="exportPlaylist(${i})">📊 Excel</a></td></tr>`; }).join('')}</table>
    <div style="display:flex;gap:16px;margin:10px 0 0;font-size:12px;color:var(--mute)">
      <span class="st ok">Aquí</span><span class="st elsewhere">Otra carpeta</span><span class="st inbox">En descargas</span><span class="st missing">Falta</span></div>
    <div class="vhead" style="margin-top:28px"><h2>Dónde viven tus canciones</h2><span class="sub">Carpetas de donde salen los archivos que usan tus playlists.</span></div>
    <table>${top.map(([d,nf])=>`<tr><td style="width:45%"><span class="path" onclick="reveal(${jsq(d)})">${esc(short(d))}</span></td>
      <td><div class="bar" style="margin:6px 0 0;height:7px"><i style="width:${nf/max*100}%;background:var(--info)"></i></div></td><td class="mono" style="width:60px;text-align:right">${nf}</td></tr>`).join('')}</table>`;
}

function hostLabel(u){ const h=(u||'').toLowerCase();
  return h.includes('spotify')?'Spotify':h.includes('deezer')?'Deezer':h.includes('soundcloud')?'SoundCloud':h.includes('tidal')?'Tidal'
    :h.includes('apple')?'Apple Music':h.includes('youtu')?'YouTube':'Link'; }
const SRC_TAG = {deezer:'DZ', archivos:'📄', carpetas:'📁'};
const DJ_LABEL = {rekordbox:'Rekordbox', traktor:'Traktor', serato:'Serato', engine:'Engine DJ', m3u:'M3U'};
function links(r){

  if(r.url) out.push(`<a class="lnk" onclick="openUrl(${jsq(r.url)})">${hostLabel(r.url)} ↗</a>`);

  return out.join('<span style="color:var(--line)"> · </span>');
}
async function exportPlaylist(i){

async function cxPick(which){
  const cur = which==='archivos' ? CX.archivos.folder : (which==='m3u' ? CX.m3u.folder : CX[which].dir);
  const p = await api().pick_folder(cur || S.settings.dest_root);
  if(!p) return;
  if(which==='archivos') CX.archivos.folder = p; else if(which==='m3u') CX.m3u.folder = p; else { CX[which].dir = p; CX[which].available = true; }
  cxDirty(); render();
}
async function cxPickNml(){ const p = await api().pick_file(CX.traktor.nml, 'nml'); if(p){ CX.traktor.nml = p; cxDirty(); render(); } }
async function cxSave(){
  const c = CX;
  const payload = {folder_name: c.folder_name,
    sources:{spotify:{enabled:c.spotify.enabled},
      deezer:{enabled:c.deezer.enabled, user:c.deezer.user, playlists:c.deezer.playlists.split('\n').map(x=>x.trim()).filter(Boolean), include_loved:c.deezer.include_loved},
      archivos:{enabled:c.archivos.enabled, folder:c.archivos.folder}},
    mik:{auto:c.mik.auto, comment:c.mik.comment, cues:c.mik.cues},
    destinations:{rekordbox:{enabled:c.rekordbox.enabled}, traktor:{enabled:c.traktor.enabled, nml:c.traktor.nml}, m3u:{enabled:c.m3u.enabled, folder:c.m3u.folder},
      serato:{enabled:c.serato.enabled, dir:c.serato.dir}, engine:{enabled:c.engine.enabled, dir:c.engine.dir}}};
  const r = await api().save_connections(payload);
  if(!r.ok){ taskErr(r); return; }
  S.sources = r.sources; S.dests = r.destinations; S.settings.rekordbox_folder = r.folder_name;
  S.rbMik = {auto:c.mik.auto, comment:c.mik.comment, cues:c.mik.cues};
  if(S.view==='conn') cxInit();
  render();
  const dz = (r.info||{}).deezer;

    + ((r.warnings||[]).length?`<br><span style="color:var(--org)">${r.warnings.map(esc).join('<br>')}</span>`:'') + folderRenMsg((r.info||{}).folder_rename) + '<br>Dale ⟳ para traer las playlists.', !!(r.warnings||[]).length);
}

function folderRenMsg(x){
  if(!x) return '';
  let m = '';
  const done = Object.values(x.done||{});
  if(done.length) m += `<br>🎛️ Carpeta renombrada a <b>«${esc(x.name)}»</b> en ${done.map(esc).join(', ')}: son las mismas playlists, no se duplicaron.`;
  if((x.pending||[]).length) m += `<br><span style="color:var(--org)">${x.pending.map(esc).join(', ')}: se renombra en cuanto lo cierres.</span>`;
  return m;
}

function wizCheck(){

    if(w.dest_root===w.inbox) return 'Música organizada y descargas deben ser carpetas distintas.'; }
  return '';

function rbOptions(c){

          ${c.source && c.source!=='spotify' && c.type!=='created' ? `<div class="meta">Esta playlist viene de ${esc(SRC_NAME[c.source]||c.source)}: desde BrainOrder no se puede modificar allá.</div>`:''}</div>

  let t = `<br><b>${esc(x.label)}</b>: ` + (x.count ? `${x.count} canciones ${applied?'actualizadas':'por actualizar'} (${parts.join(' · ')})${x.backup&&applied?` <span class="art">respaldo ${esc(x.backup)}</span>`:''}` : 'ya tiene todo ✅');
  if(x.serato_no_cues) t += `<br><span class="art">Serato: ${x.serato_no_cues} canciones tienen hot cues de MIK que Serato no ve. En Mixed In Key activa escribir los cue points para Serato y vuelve a analizarlas.</span>`;

}

// ---------- duplicados físicos ----------
let DUP = {scan:null, keep:{}, rm:{}, filter:'all', q:''};
const mb = n => n>=1e9 ? (n/1e9).toFixed(2)+' GB' : (n/1e6).toFixed(1)+' MB';
const mmss = s => s ? `${Math.floor(s/60)}:${String(Math.round(s%60)).padStart(2,'0')}` : '';
async function dupScan(){
  setTimeout(()=>{ if(S.view==='dups') render(); }, 150);
  const r = await api().dup_scan();
  if(!r.ok){ taskErr(r); render(); return; }
  dupLoad(r.scan); DUP.rbOpen = r.rekordbox_running; render();
  toast(r.scan.groups.length ? `<b>${r.scan.groups.length}</b> grupos de duplicados entre ${r.scan.files_scanned} archivos. Se pueden recuperar <b>${mb(r.scan.bytes)}</b>.` : `Sin duplicados entre ${r.scan.files_scanned} archivos. 🎉`);
}
function dupLoad(scan){
  DUP.scan = scan; DUP.keep = {}; DUP.rm = {};
  scan.groups.forEach(g=>{ DUP.keep[g.id] = g.keep; DUP.rm[g.id] = new Set(g.files.map(f=>f.path).filter(p=>p!==g.keep)); });
}
function dupKeep(gid, path){ const prev = DUP.keep[gid]; DUP.keep[gid] = path; DUP.rm[gid].delete(path); if(prev && prev!==path) DUP.rm[gid].add(prev); render(); }
function dupToggle(gid, path, on){ if(DUP.keep[gid]===path) return; on ? DUP.rm[gid].add(path) : DUP.rm[gid].delete(path); dupSum(); }
function dupAll(on){ dupGroups().forEach(g=>{ DUP.rm[g.id] = new Set(on ? g.files.map(f=>f.path).filter(p=>p!==DUP.keep[g.id]) : []); }); render(); }
function dupGroups(){ const q = DUP.q.toLowerCase();
  return (DUP.scan ? DUP.scan.groups : []).filter(g => (DUP.filter==='all' || g.kind===DUP.filter) && (!q || (g.song + ' ' + g.files.map(f=>f.path).join(' ')).toLowerCase().includes(q))); }
function dupSel(){ let n=0, bytes=0; (DUP.scan?DUP.scan.groups:[]).forEach(g=>g.files.forEach(f=>{ if(DUP.rm[g.id] && DUP.rm[g.id].has(f.path)){ n++; bytes+=f.size; } })); return {n, bytes}; }
function dupSum(){ const s = dupSel(), el = $('dupSum'), b = $('dupGo');
  if(el) el.innerHTML = s.n ? `Se apartarán <b>${s.n}</b> archivo${s.n!==1?'s':''} (${mb(s.bytes)})` : 'Marca lo que quieres apartar';
  if(b) b.disabled = !s.n || running('dup_apply'); }
function dupsView(){
  const sc = DUP.scan, busyScan = running('dup_scan');
  const head = `<div class="vhead"><h2>Duplicados</h2><span class="sub">Archivos repetidos en toda tu música: carpetas de playlists, descargas y las demás carpetas de Ajustes (respetando tus exclusiones).</span>
    <div class="sp"><button class="primary" ${busyScan?'disabled':''} onclick="dupScan()">${busyScan?'Buscando…':'🔍 '+(sc?'Volver a buscar':'Buscar duplicados')}</button></div></div>`;
  if(!sc) return head + `<div class="empty"><h3>Busca archivos repetidos</h3><p>Encuentra <b>copias idénticas</b> (aunque tengan otro nombre) y la <b>misma canción</b> en otro formato o calidad.
    Te sugiero cuál conservar —el que tiene cues en Rekordbox, el analizado con Mixed In Key, el de mejor calidad— y tú decides. Nada se borra: lo que apartes va a <code>_duplicados</code> y se puede deshacer.</p></div>`;
  const groups = dupGroups(), nI = sc.groups.filter(g=>g.kind==='identicos').length, nC = sc.groups.length - nI;
  const chip = (k,t,n) => `<button class="chipf ${DUP.filter===k?'on':''} ${k==='all'?'all':k==='identicos'?'here':'inbox'}" onclick="DUP.filter='${k}';render()">${t} <span class="mono">${n}</span></button>`;
  return head + `<div class="cards">
      <div class="card"><div class="k">Grupos</div><div class="v mono">${sc.groups.length}</div></div>
      <div class="card ok"><div class="k">Copias idénticas</div><div class="v mono">${nI}</div></div>
      <div class="card org"><div class="k">Misma canción</div><div class="v mono">${nC}</div></div>
      <div class="card"><div class="k">Recuperable</div><div class="v mono">${mb(sc.bytes)}</div></div></div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0 4px">${chip('all','Todos',sc.groups.length)}${chip('identicos','Idénticos',nI)}${chip('cancion','Misma canción',nC)}
      <input class="search" style="margin-left:auto;max-width:260px" placeholder="Buscar…" value="${esc(DUP.q)}" oninput="DUP.q=this.value;clearTimeout(DUP.t);DUP.t=setTimeout(render,250)">
      <button class="ghost" onclick="dupAll(true)">Marcar sugeridos</button><button class="ghost" onclick="dupAll(false)">Desmarcar todo</button></div>
    ${!sc.rb_read?'<div class="box warn">No pude leer Rekordbox, así que no se tuvo en cuenta para sugerir qué conservar.</div>':''}
    ${groups.slice(0,300).map(g=>`<div class="dg"><div class="dh"><b>${esc(g.song)}</b>
        <span class="bdg">${g.kind==='identicos'?'copia idéntica':'misma canción'}</span><span class="art mono">${mmss(g.seconds)}</span>
        <span class="art">sugerido: ${esc(g.why)}</span></div>
      ${g.files.map(f=>{ const keep = DUP.keep[g.id]===f.path, rm = DUP.rm[g.id].has(f.path);
        return `<div class="df ${keep?'keep':''}">
          <input type="radio" name="k_${g.id}" ${keep?'checked':''} title="Conservar este" onchange="dupKeep('${g.id}', ${jsq(f.path)})">
          <input type="checkbox" ${rm?'checked':''} ${keep?'disabled':''} title="Apartar este" onchange="dupToggle('${g.id}', ${jsq(f.path)}, this.checked)">
          <div style="min-width:0"><div class="path" onclick="reveal(${jsq(f.path)})" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(short(f.path))}</div>
            <div class="meta"><span class="mono">${f.ext.toUpperCase()}${f.bitrate?' · '+f.bitrate+' kbps':''} · ${mb(f.size)}</span>
              ${f.key?keyChip({key:f.key, mik:f.mik, source:f.path}):''}${f.energy?`<span class="mono">E${f.energy}</span>`:''}
              ${f.rb_cues?`<span class="bdg rb">Rekordbox · ${f.rb_cues} cues</span>`:f.in_rb?`<span class="bdg rb">en Rekordbox${f.rb_playlists?' · '+f.rb_playlists+' playlists':''}</span>`:''}
              ${f.mik?'<span class="bdg mik">MIK</span>':''}${f.used_by.length?`<span class="bdg pl" title="${esc(f.used_by.join(', '))}">♫ ${f.used_by.length} playlist${f.used_by.length!==1?'s':''}</span>`:''}</div></div>
          <span class="art">${keep?'<b style="color:var(--ok)">conservar</b>':rm?'apartar':''}</span></div>`; }).join('')}</div>`).join('')}
    ${groups.length>300?`<div class="art">Mostrando 300 de ${groups.length}. Usa el buscador o los filtros.</div>`:''}
    <div class="rbar"><span id="dupSum" style="flex:1;color:var(--mute)"></span>
      <button class="warn" id="dupGo" onclick="dupAsk()">Apartar marcados</button></div>`;
}
function dupAsk(){
  const s = dupSel();
  modal(`<h3>Apartar ${s.n} archivo${s.n!==1?'s':''}</h3>
    <p>Se mueven a <code>${esc(short(DUP.scan.dest))}/_duplicados</code> (${mb(s.bytes)}). Nada se borra: revísalos y bórralos tú cuando quieras, o deshazlo desde <b>Historial</b>.</p>
    <div class="box">🎧 Si alguno está en Rekordbox, Traktor, Serato o Engine, sus playlists pasan a usar el archivo que conservas (con respaldo). <b>Tus programas de DJ tienen que estar cerrados.</b></div>
    ${DUP.rbOpen?'<div class="box warn">⚠️ Rekordbox parece abierto: ciérralo antes de continuar.</div>':''}
    <div class="actions"><button onclick="closeModal()">Cancelar</button><button class="warn" onclick="closeModal();dupApply()">Apartar</button></div>`);
}
async function dupApply(){
  const choices = {};
  DUP.scan.groups.forEach(g=>{ const rm=[...DUP.rm[g.id]]; if(rm.length) choices[g.id] = {keep:DUP.keep[g.id], remove:rm}; });
  setTimeout(dupSum, 100);
  const r = await api().dup_apply(choices);
  if(!r.ok){ taskErr(r); dupSum(); return; }
  await applyAnalysis(r); dupLoad(r.scan); loadHist(); render();
  const x = r.result;
  toast(`<b>${x.retired}</b> archivo${x.retired!==1?'s':''} apartado${x.retired!==1?'s':''} en _duplicados.`
    + (x.rekordbox?`<br>Rekordbox: ${x.rekordbox.paths} rutas corregidas, ${x.rekordbox.repointed} entradas re-apuntadas.`:'')
    + Object.entries(x.dj||{}).map(([k,v])=>`<br>${esc(DJ_LABEL[k]||k)}: ${v.refs} referencias corregidas.`).join('')
    + (x.dj_warnings||[]).map(w=>`<br><span style="color:var(--org)">${esc(w)}</span>`).join('') + undoLink(x));
}
