<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>SpotiSync</title>
<style>
:root{
  --bg:#0d0e12; --panel:#15171d; --panel2:#1c1f27; --line:#2a2e39; --text:#e9ebf0; --mute:#8b91a1;
  --acid:#c8f53c; --ok:#3ddc97; --org:#ffb547; --miss:#ff5d6c; --info:#6aa8ff;
  --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:13.5px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;border-radius:9px;padding:8px 14px;background:var(--panel2);color:var(--text);
  border:1px solid var(--line);transition:.15s}
button:hover{border-color:#3c4252;background:#232733}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--acid);color:#111;border-color:var(--acid);font-weight:650}
button.primary:hover{filter:brightness(1.07)}
button.warn{background:var(--org);color:#111;border-color:var(--org);font-weight:650}
button.ghost{background:transparent;border-color:transparent;color:var(--mute)}
button.ghost:hover{color:var(--text);background:var(--panel2)}
.mono{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-rows:auto auto auto 1fr;height:100vh}
header{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line);-webkit-app-region:drag}
header *{-webkit-app-region:no-drag}
.logo{font-weight:800;letter-spacing:-.02em;font-size:18px;margin-right:6px}
.logo span{color:var(--acid)}
.conn{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:12.5px;margin-right:auto}
.dot{width:8px;height:8px;border-radius:50%;background:var(--miss)}
.dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:10px;background:rgba(0,0,0,.25);font-size:11.5px;text-align:center}
.progress{height:34px;display:flex;align-items:center;gap:10px;padding:0 20px;color:var(--mute);font-size:12.5px;border-bottom:1px solid var(--line);background:var(--panel);position:relative}
#progTxt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar{display:none;width:260px;height:8px;border-radius:5px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acid),var(--ok));border-radius:5px;transition:width .25s ease}
#ppct{display:none;width:42px;text-align:right;color:var(--text);font-weight:650}
.progress.haspct .pbar,.progress.haspct #ppct{display:block}
.progress.haspct::after{content:"";position:absolute;left:0;bottom:-1px;height:2px;width:var(--p,0%);background:var(--acid);transition:width .25s ease}
.pcard{max-width:520px;margin:60px auto;text-align:center}
.rules{max-width:860px}
.cx{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0 0;background:var(--panel2)}
.cxh{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.cxh b{font-size:14px}
.tag{font-size:11.5px;color:var(--mute);border:1px solid var(--line);border-radius:20px;padding:1px 8px;margin-right:auto}
.tag.ok{color:var(--ok);border-color:rgba(61,220,151,.35)}
.sw{position:relative;width:38px;height:22px;flex:none;cursor:pointer}
.sw input{opacity:0;width:0;height:0}
.sw i{position:absolute;inset:0;background:var(--line);border-radius:22px;transition:.15s}
.sw i::after{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.15s}
.sw input:checked+i{background:var(--acid)}
.sw input:checked+i::after{transform:translateX(16px);background:#111}
.rules label.f{display:block;margin:10px 0 4px;color:var(--mute);font-size:12.5px}
.rules input.t{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit}
.rules section{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin:0 0 16px}
.rules h3{margin:0 0 4px;font-size:15px}
.rules .hint{color:var(--mute);font-size:12.5px;margin:0 0 12px}
.rules textarea,.rules input[type=number]{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit}
.rules textarea{width:100%;min-height:86px;font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:12.5px}
.rules input[type=number]{width:80px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chipx{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 6px 4px 10px;font-size:12.5px;max-width:100%}
.chipx span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chipx button{padding:0 6px;border:0;background:none;color:var(--mute)}
.prow{display:flex;align-items:center;gap:10px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;margin-bottom:5px;background:var(--panel2)}
.prow.ign{opacity:.5}
.prow.drag{outline:2px dashed var(--acid)}
.prow .hd{cursor:grab;color:var(--mute);user-select:none}
.prow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .ix{width:26px;color:var(--mute);text-align:right}
.prow button{padding:2px 8px}
.prow select{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:3px 6px;font:inherit}
.fmt{display:flex;gap:6px;flex-wrap:wrap}
.fmt .chipx{padding:4px 6px}
.rbar{position:sticky;bottom:-40px;background:var(--bg);border-top:1px solid var(--line);padding:14px 0 18px;display:flex;gap:10px;align-items:center}
#tasks{display:none;flex-direction:column;gap:4px;padding:6px 20px 8px;border-bottom:1px solid var(--line);background:var(--panel);max-height:140px;overflow:auto}
#tasks.on{display:flex}
.trow{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--mute)}
.trow b{color:var(--text);font-weight:650;white-space:nowrap}
.trow .tm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .pbar{display:block;width:200px;height:6px}
.trow .tp{width:40px;text-align:right;color:var(--text);font-weight:650}
.trow.queued b::after{content:" · en cola";color:var(--org);font-weight:500}
.trow.queued .pbar i{background:var(--line)}
.pcard .big{font-size:56px;font-weight:800;letter-spacing:-.03em;color:var(--acid)}
.pcard .pbar{display:block;width:100%;height:12px;margin:14px 0 10px}
.spin{width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--acid);border-radius:50%;animation:s .8s linear infinite;display:none}
.busy .spin{display:block}
@keyframes s{to{transform:rotate(360deg)}}
.body{display:grid;grid-template-columns:270px 1fr;min-height:0}
aside{border-right:1px solid var(--line);overflow:auto;padding:14px 10px}
aside h4{margin:14px 10px 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:600}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:block;padding:8px 10px;border-radius:8px;color:var(--text);text-decoration:none;cursor:pointer}
.nav a:hover{background:var(--panel2)}
.nav a.sel{background:var(--panel2);box-shadow:inset 3px 0 0 var(--acid)}
.nav .row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.nav .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .cnt{font-size:11.5px;color:var(--mute)}
.bar{height:4px;border-radius:2px;background:var(--line);margin-top:6px;display:flex;overflow:hidden}
.bar i{display:block;height:100%}
main{overflow:auto;padding:20px 24px 40px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer}
.card:hover{border-color:#3c4252}
.card .k{font-size:11.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.card .v{font-size:28px;font-weight:750;margin-top:2px;letter-spacing:-.02em}
.card.ok .v{color:var(--ok)} .card.org .v{color:var(--org)} .card.miss .v{color:var(--miss)}
.vhead{display:flex;align-items:flex-end;gap:12px;margin:6px 0 12px;flex-wrap:wrap}
.vhead h2{margin:0;font-size:22px;letter-spacing:-.02em}
.vhead .sub{color:var(--mute);font-size:12.5px}
.vhead .sp{margin-left:auto;display:flex;gap:8px}
input.search{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:8px 12px;width:240px;font:inherit}
table{width:100%;border-collapse:collapse}
th{position:sticky;top:-20px;background:var(--bg);text-align:left;font-weight:600;font-size:11.5px;color:var(--mute);
  text-transform:uppercase;letter-spacing:.05em;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:8px 10px;border-bottom:1px solid #1d2028;vertical-align:top}
tr:hover td{background:#13151b}
td .art{color:var(--mute);font-size:12.5px}
.chip{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11.5px;margin:1px 4px 1px 0;border:1px solid var(--line);background:var(--panel2);white-space:nowrap;cursor:pointer}
.chip:hover{border-color:var(--acid)}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;white-space:nowrap}
.st:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st.ok{color:var(--ok)} .st.inbox{color:var(--org)} .st.elsewhere{color:var(--info)} .st.dup{color:var(--mute)} .st.missing{color:var(--miss)}
.path{color:var(--mute);font-size:12px;word-break:break-all;cursor:pointer}
.path:hover{color:var(--text)}
a.lnk{color:var(--acid);text-decoration:none;cursor:pointer;font-size:12px}
.empty{padding:70px 20px;text-align:center;color:var(--mute)}
.empty h3{color:var(--text);font-size:18px;margin:0 0 6px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:10;padding:20px}
.modal-bg.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:min(640px,100%);max-height:88vh;overflow:auto;padding:22px 24px}
.modal h3{margin:0 0 4px;font-size:18px}
.modal p{color:var(--mute);margin:4px 0 14px}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
label.f{display:block;margin:12px 0 4px;font-size:12px;color:var(--mute)}
input.t,textarea.t{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 10px;font:inherit}
textarea.t{min-height:70px;font-family:"SF Mono",Menlo,monospace;font-size:12px}
.box{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0;font-size:12.5px}
.box.warn{border-color:rgba(255,181,71,.5)}
.box b{color:var(--text)}
.frow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.frow .nm{flex:1;min-width:0}
.frow .nm div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:6px 10px;font-size:12px}
.seg button.on{background:var(--acid);color:#111;font-weight:650}
.pick{display:flex;gap:8px;align-items:center}
.pickpath{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
.pickpath:hover{border-color:#3c4252}
button.pa{border-color:rgba(106,168,255,.5);color:var(--info)}
button.pa.chg{border-color:var(--org);color:var(--org)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,181,71,.7)}100%{box-shadow:0 0 0 14px rgba(255,181,71,0)}}
.pulse{animation:pulse 1s ease-out 3}
button.ro{border-color:rgba(61,220,151,.45);color:var(--ok)}
select.rg{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;font-size:12.5px;max-width:100%}
details.rgg{border:1px solid var(--line);border-radius:10px;margin:8px 0;background:var(--panel)}
details.rgg summary{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;list-style:none}
details.rgg summary::-webkit-details-marker{display:none}
details.rgg summary .rg{margin-left:auto}
details.rgg table{margin:0 0 6px}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--text)}
th.sortable.on{color:var(--acid)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.chipf{padding:5px 11px;border-radius:20px;font-size:12px;background:var(--panel);border:1px solid var(--line);color:var(--mute)}
.chipf .mono{margin-left:4px;opacity:.8}
.chipf.on{color:#111;font-weight:650}
.chipf.all.on{background:var(--text);border-color:var(--text)}
.chipf.missing.on{background:var(--miss);border-color:var(--miss)}
.chipf.inbox.on{background:var(--org);border-color:var(--org)}
.chipf.elsewhere.on{background:var(--info);border-color:var(--info)}
.chipf.here.on{background:var(--ok);border-color:var(--ok)}
.oxrow{display:flex;gap:10px;align-items:flex-start;padding:7px 4px;cursor:pointer;border-bottom:1px solid #1d2028}
.oxrow input{margin-top:3px}
button.cp{padding:7px 11px;font-size:12.5px}
button.cp.sp{border-color:rgba(200,245,60,.45);color:var(--acid)}
button.cp.dz{border-color:rgba(167,139,250,.5);color:#a78bfa}
button.cp:hover:not(:disabled){background:rgba(255,255,255,.04)}
.vhead .sp{flex-wrap:wrap;justify-content:flex-end}
button.xl{border-color:rgba(52,211,153,.45);color:#34d399}
button.xl:hover{background:rgba(52,211,153,.1);border-color:#34d399}
.toast{position:fixed;bottom:18px;right:18px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 16px;max-width:420px;display:none;z-index:20;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.show{display:block}
.toast.err{border-color:var(--miss)}
code{background:var(--bg);padding:1px 6px;border-radius:5px;font-size:12px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">Spoti<span>Sync</span></div>
    <div class="conn"><div class="dot" id="dot"></div><span id="connTxt">Sin conectar</span></div>
    <button class="ghost" id="btnConn" onclick="connect()">Conectar Spotify</button>
    <button onclick="openSettings()">Ajustes</button>
    <button onclick="exportMissing()" id="btnExport" disabled>Exportar a Excel</button>
    <button class="primary" onclick="analyze()" id="btnAnalyze" title="Lee todas tus playlists de Spotify (tarda más)">Analizar todo</button>
    <button class="warn" onclick="askOrganize()" id="btnOrg" title="Archivos en tu carpeta de descargas" disabled>Organizar<span class="badge mono" id="orgBadge">0</span></button>
  </header>
  <div class="progress" id="prog"><div class="spin"></div><span id="progTxt">Listo.</span>
    <div class="pbar" id="pbar"><i id="pfill"></i></div><span class="mono" id="ppct"></span></div>
  <div id="tasks"></div>
  <div class="body">
    <aside>
      <div class="nav">
        <a data-v="missing" onclick="show('missing')"><div class="row"><span class="name">Faltan por descargar</span><span class="cnt mono" id="nMissing">–</span></div></a>
        <a data-v="organize" onclick="show('organize')"><div class="row"><span class="name">Listas para organizar</span><span class="cnt mono" id="nOrg">–</span></div></a>
        <a data-v="stats" onclick="show('stats')"><div class="row"><span class="name">Estadísticas</span><span class="cnt mono" id="nPct">–</span></div></a>
        <a data-v="unify" onclick="show('unify')"><div class="row"><span class="name">Unificar repetidos</span><span class="cnt mono" id="nUni">–</span></div></a>
        <a data-v="conn" onclick="show('conn')"><div class="row"><span class="name">Conexiones</span><span class="cnt mono" id="nConn">–</span></div></a>
        <a data-v="rules" onclick="show('rules')"><div class="row"><span class="name">Reglas</span><span class="cnt mono" id="nRules">–</span></div></a>
        <a data-v="foreign" onclick="show('foreign')"><div class="row"><span class="name">Playlists de otros</span><span class="cnt mono" id="nForeign">–</span></div></a>
      </div>
      <h4 style="display:flex;align-items:center;justify-content:space-between">Tus playlists
        <button class="ghost" style="padding:2px 8px;font-size:13px" onclick="loadPlaylists()" title="Recargar la lista de playlists de Spotify (rápido, sin canciones)">⟳</button></h4>
      <div class="nav" id="plNav"></div>
    </aside>
    <main id="main"></main>
  </div>
</div>

<div class="modal-bg" id="mbg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
let S = {analysis:null, foreign:{}, settings:{}, connected:false, view:'missing', q:''};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const jsq = s => esc(JSON.stringify(String(s ?? '')));
const api = () => window.pywebview.api;
// rutas de Mac (/) y de Windows (\)
const short = p => { const h = S.home || ''; return (h && (p||'').startsWith(h)) ? '~' + p.slice(h.length) : (p||''); };
const base = p => (p||'').split(/[\\/]/).pop();
const folderOf = p => (p||'').split(/[\\/]/).slice(-2,-1)[0] || '';

// ---------- multitarea ----------
// Cada tarea del programa (analizar una playlist, organizar, unificar…) llega con su propio % por onTask.
// Varias pueden correr a la vez; las que mueven archivos esperan su turno ("en cola").
const T = {};   // clave -> {id,label,msg,pct,state}
const running = k => !!T[k];
window.onTask = ev => {
  if(ev.state==='done'){ if(T[ev.key] && T[ev.key].id===ev.id) delete T[ev.key]; }
  else {
    const t = T[ev.key] && T[ev.key].id===ev.id ? T[ev.key] : (T[ev.key] = {id:ev.id, label:ev.label, msg:'', pct:0, state:'start'});
    if(ev.msg) t.msg = ev.msg;
    if(ev.pct !== null && ev.pct !== undefined) t.pct = ev.pct;
    t.state = ev.state;
  }
  paintTasks();
};
function paintTasks(){
  const keys = Object.keys(T), box = $('tasks');
  box.classList.toggle('on', keys.length>0);
  $('prog').classList.toggle('busy', keys.length>0);
  if(keys.length) $('progTxt').textContent = keys.length===1 ? 'Trabajando…' : `${keys.length} tareas en curso`;
  box.innerHTML = keys.map(k => { const t=T[k];
    return `<div class="trow${t.state==='queued'?' queued':''}"><b>${esc(t.label)}</b><span class="tm">${esc(t.msg||'')}</span>
      <div class="pbar"><i style="width:${t.pct||0}%"></i></div><span class="tp mono">${t.state==='queued'?'–':(t.pct||0)+'%'}</span></div>`; }).join('');
  // botones y tarjetas que muestran el % de su propia tarea
  document.querySelectorAll('[data-task]').forEach(el => {
    const t = T[el.dataset.task], kind = el.dataset.kind;
    if(kind==='btn'){ el.disabled = !!t; el.textContent = t ? `${el.dataset.busy||'Trabajando'} ${t.state==='queued'?'(en cola)':(t.pct||0)+'%'}` : el.dataset.idle; }
    else if(kind==='card' && t){ el.querySelector('.big').textContent=(t.pct||0)+'%'; el.querySelector('.pbar i').style.width=(t.pct||0)+'%'; if(t.msg) el.querySelector('.art:last-child').textContent=t.msg; }
  });
  const a = $('btnAnalyze'); if(a){ const t=T['analyze:all']; a.disabled=!!t; a.textContent = t?`Analizando ${t.pct||0}%`:'Analizar todo'; }
  const c = $('btnConn'); if(c) c.disabled = running('connect');
}
// Mensaje de estado para acciones cortas (no bloquea nada).
function busy(on, msg){ if(msg && !Object.keys(T).length) $('progTxt').textContent = msg; }
// Aplicar un análisis nuevo sin pisar uno más reciente que trajo otra tarea, y sin perder la vista actual.
async function applyAnalysis(r){
  if(!r || !r.analysis) return;
  if(r.rev !== undefined && r.rev !== null && S.rev !== undefined && r.rev < S.rev){
    try{ const st = await api().get_state(); if(st.analysis && st.rev >= S.rev){ setAnalysis(st.analysis, st.rev); } }catch(e){}
    return;
  }
  setAnalysis(r.analysis, r.rev);
}
function setAnalysis(analysis, rev){
  const m = /^(pl|reorg):(\d+)$/.exec(S.view||''), id = m && S.analysis && S.analysis[+m[2]] ? S.analysis[+m[2]].id : null;
  S.analysis = analysis; if(rev !== undefined && rev !== null) S.rev = rev;
  if(id){ const i = analysis.findIndex(p=>p.id===id); S.view = i>=0 ? `${m[1]}:${i}` : 'missing'; if(m[1]==='reorg' && i>=0) RG.i = i; }
}
const plIdx = id => (S.analysis||[]).findIndex(p=>p.id===id);
function taskErr(r){ if(r.dup) toast(esc(r.error)); else toast(esc(r.error), true); }
function toast(msg, err){ const t=$('toast'); t.innerHTML=msg; t.className='toast show'+(err?' err':''); clearTimeout(t._t); t._t=setTimeout(()=>t.className='toast', err?9000:5000); }
function modal(html){ $('modal').innerHTML = html; $('mbg').classList.add('show'); }
function closeModal(){ $('mbg').classList.remove('show'); }

// ---------- datos derivados ----------
function allRows(){ return (S.analysis||[]).flatMap(pl => pl.tracks.map(t => ({...t, pl}))); }
function missingUnique(){
  const m = new Map();
  for (const r of allRows()) if (r.status==='missing'){
    if(!m.has(r.id)) m.set(r.id, {...r, pls:[]});
    m.get(r.id).pls.push(r.pl);
  }
  return [...m.values()];
}
// movimientos únicos (un archivo por canción) + descargas repetidas
// pid opcional: solo esa playlist
function rowsOf(pid){ return pid ? allRows().filter(r=>r.pl.id===pid) : allRows(); }
function toOrganize(pid){ const seen=new Set(); return rowsOf(pid).filter(r => r.status==='inbox' && !seen.has(r.source) && seen.add(r.source)); }
function dupList(pid){ const moves=new Set(toOrganize(pid).map(r=>r.source)); const m=new Map();
  for(const r of rowsOf(pid)) for(const d of (r.inbox_dups||[])) if(!moves.has(d) && !m.has(d)) m.set(d, r); return [...m].map(([path,r])=>({path,r})); }
function orgAvail(){ return (S.inboxCount||0) > 0 || orgCount() > 0; }
function orgCount(pid){ return S.analysis ? toOrganize(pid).length + dupList(pid).length : 0; }
const changed = pl => !pl.pending && pl.snapshot && pl.analyzed_snapshot && pl.snapshot !== pl.analyzed_snapshot;
function counts(pl){ const c={ok:0,elsewhere:0,inbox:0,missing:0}; pl.tracks.forEach(t=>c[t.status]=(c[t.status]||0)+1); return c; }
function match(r){ if(!S.q) return true; const q=S.q.toLowerCase(); return (r.name+' '+r.artists.join(' ')).toLowerCase().includes(q); }

    <div class="card ok"><div class="k">Ya las tienes</div><div class="v mono">${c.ok}</div></div>

    <div class="card miss" onclick="show('missing')"><div class="k">Faltan (únicas)</div><div class="v mono">${missingUnique().length}</div></div>
  </div>`;
}

    head = `<h2>${esc(pl.name)}</h2><span class="sub path" onclick="reveal(${jsq(pl.folder)})">📁 ${esc(short(pl.folder))}</span>${pl.report?`<a class="lnk" onclick="reveal(${jsq(pl.report)})">📄 Ver .txt de faltantes</a>`:''}`; }

function renderTable(){
  const t = $('tbl'); if(!t) return;
  let html='';
  if(S.view==='missing'){
    const rows = missingUnique().filter(match);
    if(!rows.length){ t.innerHTML = `<div class="empty"><h3>No te falta nada 🎉</h3></div>`; return; }
    html = `<table><tr><th>#</th><th>Canción</th><th>Irían en</th><th></th></tr>` + rows.map((r,i)=>`<tr>
      <td class="mono" style="color:var(--mute)">${i+1}</td>
      <td><div>${esc(r.name)}</div><div class="art">${esc(r.artists.join(', '))}</div></td>
      <td><span class="chip" onclick="reveal(${jsq(r.dest_dir)})" title="${esc(short(r.dest_dir))}">📁 ${esc(r.home_name)}</span>${r.pls.filter(p=>p.name!==r.home_name).map(p=>`<span class="chip" style="opacity:.7">♫ ${esc(p.name)}</span>`).join('')}</td>
      <td style="white-space:nowrap">${links(r)}</td></tr>`).join('') + `</table>`;
  } else if(S.view==='organize'){
    const rows = toOrganize().filter(match), dups = dupList().filter(d=>match(d.r));
    if(!rows.length && !dups.length){ t.innerHTML = `<div class="empty"><h3>Nada por organizar</h3><p>Descarga canciones a tu carpeta de descargas y vuelve a Analizar.</p></div>`; return; }
    if(rows.length) html += `<table><tr><th>Canción</th><th>En descargas</th><th>Se mueve a</th></tr>` + rows.map(r=>`<tr>
      <td><div>${esc(r.name)}</div><div class="art">${esc(r.artists.join(', '))}</div></td>
      <td><div class="path" onclick="reveal(${jsq(r.source)})">${esc(base(r.source))}</div></td>
      <td><span class="chip" onclick="reveal(${jsq(r.dest_dir)})">📁 ${esc(r.home_name)}</span></td></tr>`).join('') + `</table>`;
    if(dups.length) html += `<div class="vhead" style="margin-top:26px"><h2 style="font-size:17px">Descargas repetidas</h2><span class="sub">Ya tienes estas canciones; se apartan en <code>_duplicados</code> para que las borres.</span></div>
      <table><tr><th>Archivo descargado</th><th>Ya la tienes en</th></tr>` + dups.map(d=>`<tr>
      <td><div class="path" onclick="reveal(${jsq(d.path)})">${esc(base(d.path))}</div></td>
      <td><div class="path" onclick="reveal(${jsq(d.r.source)})">${esc(short(d.r.source))}</div></td></tr>`).join('') + `</table>`;
  } else {
    const pl = S.analysis[+S.view.split(':')[1]];
    const lab = {here:'Aquí', elsewhere:'En otra carpeta', inbox:'En descargas', missing:'Falta'};
    const cls = {here:'ok', elsewhere:'elsewhere', inbox:'inbox', missing:'missing'};
    const ds = r => (r.status==='ok'||r.status==='elsewhere') ? (dirOf(r.source)===pl.folder?'here':'elsewhere') : r.status;
    // filtro por estado (chips con conteo) + orden por columna
    const cnt = {all:pl.tracks.length, here:0, elsewhere:0, inbox:0, missing:0};
    pl.tracks.forEach(r=>cnt[ds(r)]++);
    if(SO.filter!=='all' && !cnt[SO.filter]) SO.filter='all';
    let rows = pl.tracks.filter(match).filter(r => SO.filter==='all' || ds(r)===SO.filter);
    const rank = {missing:0, inbox:1, elsewhere:2, here:3};
    const key = {
      pos: r => r.pos,
      name: r => (r.name||'').toLowerCase(),
      artist: r => (r.artists[0]||'').toLowerCase(),
      status: r => rank[ds(r)]*1e5 + r.pos,
      file: r => (r.source ? short(r.source) : '\uffff').toLowerCase(),
    }[SO.col] || (r=>r.pos);
    rows = rows.slice().sort((a,b)=>{ const x=key(a), y=key(b); return (x<y?-1:x>y?1:0) * SO.dir; });
    const chip = (k,t) => cnt[k]||k==='all' ? `<button class="chipf ${SO.filter===k?'on':''} ${k}" onclick="SO.filter='${k}';renderTable()">${t} <span class="mono">${cnt[k]}</span></button>` : '';
    const th = (c,t,extra='') => `<th class="sortable ${SO.col===c?'on':''}" onclick="sortBy('${c}')" ${extra}>${t}${SO.col===c?(SO.dir>0?' ▲':' ▼'):''}</th>`;
    html = `<div class="chips">${chip('all','Todas')}${chip('missing','Falta')}${chip('inbox','En descargas')}${chip('elsewhere','En otra carpeta')}${chip('here','Aquí')}</div>
      <table><tr>${th('pos','#')}${th('name','Canción')}${th('status','Estado')}${th('file','Archivo')}</tr>` + (rows.length? rows.map(r=>`<tr>
      <td class="mono" style="color:var(--mute)">${r.pos+1}</td>
      <td><div>${esc(r.name)}</div><div class="art">${esc(r.artists.join(', '))}</div></td>
      <td><span class="st ${cls[ds(r)]}">${lab[ds(r)]}</span></td>
      <td>${r.source?`<div class="path" onclick="reveal(${jsq(r.source)})">${esc(short(r.source))}</div>`:links(r)}</td></tr>`).join('')
      : `<tr><td colspan="4" class="art" style="padding:24px;text-align:center">Ninguna canción con ese filtro.</td></tr>`) + `</table>`;
  }
  t.innerHTML = html;
}

// ---------- estadísticas ----------
const dirOf = p => (p||'').replace(/[\\/][^\\/]*$/, '');
function plStats(pl){
  const c={total:pl.tracks.length, here:0, other:0, inbox:0, missing:0};
  for(const r of pl.tracks){
    if((r.status==='ok'||r.status==='elsewhere') && r.source){ dirOf(r.source)===pl.folder ? c.here++ : c.other++; }
    else if(r.status==='inbox') c.inbox++; else c.missing++;
  }
  c.pct = c.total ? Math.round((c.here+c.other)/c.total*100) : 100; return c;
}
function globalStats(){
  const songs=new Map(), files=new Set(); let refs=0;
  for(const r of allRows()){ songs.set(r.id, r.status); if((r.status==='ok'||r.status==='elsewhere') && r.source){ refs++; files.add(r.source); } }
  const vals=[...songs.values()], owned=vals.filter(v=>v==='ok'||v==='elsewhere').length;
  return {songs:songs.size, owned, inbox:vals.filter(v=>v==='inbox').length, missing:vals.filter(v=>v==='missing').length,
          files:files.size, saved:refs-files.size, pct: songs.size?Math.round(owned/songs.size*100):100};
}

  for(const r of allRows()) if((r.status==='ok'||r.status==='elsewhere') && r.source) origins.set(dirOf(r.source), (origins.get(dirOf(r.source))||new Set()).add(r.source));
  const top = [...origins].map(([d,set])=>[d,set.size]).sort((a,b)=>b[1]-a[1]).slice(0,12), max = top.length?top[0][1]:1;
  return `<div class="cards">
      <div class="card"><div class="k">Canciones únicas</div><div class="v mono">${g.songs}</div></div>
      <div class="card ok"><div class="k">Biblioteca completa</div><div class="v mono">${g.pct}%</div></div>
      <div class="card"><div class="k">Archivos en disco</div><div class="v mono">${g.files}</div></div>
      <div class="card ok"><div class="k">Duplicados evitados</div><div class="v mono">${g.saved}</div></div></div>
    <div class="vhead"><h2>Por playlist</h2><span class="sub">Aquí = el archivo está en la carpeta de la playlist · Otra carpeta = se usa desde donde está (ver el .txt de la carpeta).</span>
      <div class="sp"><button class="xl" onclick="exportAllPlaylists()">📊 Informes de todas (uno por playlist)</button></div></div>
    <table><tr><th>Playlist</th><th style="width:30%">Completa</th><th class="mono">Total</th><th>Aquí</th><th>Otra carpeta</th><th>Descargas</th><th>Faltan</th><th></th></tr>
    ${rows.map(({pl,i,c})=>{ const n=c.total||1; return `<tr>
      <td><a class="lnk" style="color:var(--text);font-size:13.5px" onclick="show('pl:${i}')">${pl.liked?'♥ ':''}${esc(pl.name)}</a></td>
      <td><div style="display:flex;align-items:center;gap:8px"><div class="bar" style="flex:1;margin:0;height:7px">
        <i style="width:${c.here/n*100}%;background:var(--ok)"></i><i style="width:${c.other/n*100}%;background:var(--info)"></i><i style="width:${c.inbox/n*100}%;background:var(--org)"></i><i style="width:${c.missing/n*100}%;background:var(--miss)"></i></div>

let RL = null;
const FMT_LABEL = {aiff:'AIFF', wav:'WAV', flac:'FLAC', alac:'ALAC', m4a:'M4A', aac:'AAC', mp3:'MP3', ogg:'OGG'};
function rulesInit(){
  const r = JSON.parse(JSON.stringify(S.rules||{}));
  RL = {r, dirty:false, preview:null};
  r.exclude_dirs = r.exclude_dirs||[]; r.exclude_patterns = r.exclude_patterns||[]; r.playlist_mode = r.playlist_mode||{};
  r.playlist_order = rlOrder(r.playlist_order||[]);
}
// todas las playlists, en el orden de prioridad (las nuevas al final; Me gusta última salvo que la hayas movido)
function rlOrder(order){
  const pls = (S.analysis||[]).map(p=>p.id), known = order.filter(id=>pls.includes(id));
  const rest = pls.filter(id=>!known.includes(id));
  return known.concat(rest.filter(id=>id!=='liked'), rest.filter(id=>id==='liked'));
}
const plName = id => { const p=(S.analysis||[]).find(x=>x.id===id); return p ? (p.liked?'♥ ':'')+p.name : id; };
function rlDirty(){ RL.dirty = true; RL.preview = null; const b=$('rlSave'); if(b) b.disabled=false; const p=$('rlPrev'); if(p) p.innerHTML=''; }

    <div class="hint" style="margin:6px 0 0"><code>Samples</code> cualquier carpeta con ese nombre · <code>*stem*</code> nombres que contengan «stem» · <code>*.wav</code> por extensión · <code>*/Sets/*</code> por ruta</div>
    <div style="display:flex;align-items:center;gap:8px;margin-top:12px">Ignorar audios de menos de
      <input type="number" min="0" max="600" step="5" value="${r.min_seconds||0}" oninput="RL.r.min_seconds=+this.value||0;rlDirty()"> segundos
      <span class="hint" style="margin:0">(0 = no. Útil para one-shots; la primera vez tarda porque lee cada archivo)</span></div>
    <div style="display:flex;align-items:center;gap:10px;margin-top:14px"><button onclick="rlPreview()" ${running('rules_preview')?'disabled':''}>🔍 Probar</button>
      <span class="hint" style="margin:0">Cuenta cuántos archivos quedarían fuera, sin guardar nada.</span></div>
    <div id="rlPrev">${pv?rlPreviewHtml(pv):''}</div>
  </section>

  <section><h3>🏠 Prioridad de playlists</h3>
    <p class="hint">Cuando una canción está en varias playlists, su archivo vive en la carpeta de la <b>primera</b> de esta lista. Arrastra o usa las flechas. «Ignorar» la saca de todo.</p>
    ${order.length ? order.map((id,k)=>{ const ign=(r.playlist_mode[id]==='ignorar'); return `<div class="prow${ign?' ign':''}" draggable="true" data-k="${k}"
        ondragstart="RL.drag=${k};this.classList.add('drag')" ondragend="this.classList.remove('drag')"
        ondragover="event.preventDefault()" ondrop="event.preventDefault();rlMove(RL.drag,${k})">

        <button class="ghost" onclick="rlMove(${k},${k-1})" ${k===0?'disabled':''} title="Subir">↑</button>
        <button class="ghost" onclick="rlMove(${k},${k+1})" ${k===order.length-1?'disabled':''} title="Bajar">↓</button>
        <select onchange="rlMode(${jsq(id)},this.value)"><option value="organizar"${ign?'':' selected'}>Organizar</option><option value="ignorar"${ign?' selected':''}>Ignorar</option></select></div>`; }).join('')
      : '<div class="hint">Carga tus playlists (⟳ en la barra lateral) para ordenarlas.</div>'}
  </section>

  <section><h3>🎚️ Comparación</h3>

    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">Misma canción si la duración difiere hasta

      o hasta <input type="number" min="0" max="20" step="0.5" value="${r.dur_tol_pct??3}" oninput="RL.r.dur_tol_pct=+this.value;rlDirty()"> %

    <div class="fmt">${(r.format_order||[]).map((f,k)=>`<div class="chipx"><span class="mono">${k+1}. ${FMT_LABEL[f]||f}</span>
      <button onclick="rlFmt(${k},-1)" ${k===0?'disabled':''} title="Antes">←</button><button onclick="rlFmt(${k},1)" ${k===r.format_order.length-1?'disabled':''} title="Después">→</button></div>`).join('')}</div>
  </section>

  <div class="rbar"><button class="primary" id="rlSave" onclick="rlSave()" ${RL.dirty&&!running('rules')?'':'disabled'}>Guardar y aplicar</button>
    <button onclick="rulesInit();render()" ${RL.dirty?'':'disabled'}>Descartar cambios</button>
    <span style="flex:1"></span><button class="ghost" onclick="rlDefaults()">Restaurar valores por defecto</button></div>
  </div>`;
}
function rlPreviewHtml(pv){
  return `<div class="box" style="margin-top:12px">Con estas reglas: <b>${pv.in}</b> archivos se usan y <b style="color:var(--org)">${pv.out}</b> quedan fuera.
    ${pv.roots.map(x=>`<div class="hint" style="margin:4px 0 0">📁 ${esc(short(x.root))}: ${x.exists?`${x.in} dentro · ${x.out} fuera`:'no existe'}</div>`).join('')}
    ${pv.sample.length?`<div style="margin-top:8px;font-weight:600">Ejemplos de lo que queda fuera</div>${pv.sample.map(p=>`<div class="hint mono" style="margin:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(short(p))}</div>`).join('')}`:''}
    ${(pv.warnings||[]).map(w=>`<div style="color:var(--miss);margin-top:6px">${esc(w)}</div>`).join('')}</div>`;
}
async function rlAddDir(){ const p = await api().pick_folder(S.settings.dest_root); if(p && !RL.r.exclude_dirs.includes(p)){ RL.r.exclude_dirs.push(p); rlDirty(); render(); } }
function rlDelDir(k){ RL.r.exclude_dirs.splice(k,1); rlDirty(); render(); }
function rlMove(a,b){ const o=RL.r.playlist_order; if(a==null||b<0||b>=o.length||a===b) return; const [x]=o.splice(a,1); o.splice(b,0,x); rlDirty(); render(); }
function rlMode(id,v){ if(v==='ignorar') RL.r.playlist_mode[id]='ignorar'; else delete RL.r.playlist_mode[id]; rlDirty(); render(); }
function rlFmt(k,d){ const o=RL.r.format_order, j=k+d; [o[k],o[j]]=[o[j],o[k]]; rlDirty(); render(); }
function rlDefaults(){ RL.r = {exclude_dirs:[], exclude_patterns:[], min_seconds:0, dur_tol_s:6, dur_tol_pct:3,
  format_order:['aiff','wav','flac','m4a','mp3'], playlist_order:rlOrder([]), playlist_mode:{}}; rlDirty(); render(); }
async function rlPreview(){
  const r = await api().preview_rules(RL.r);
  if(!r.ok){ taskErr(r); return; }
  RL.preview = r; if(S.view==='rules') render();
}
async function rlSave(){
  const draft = JSON.parse(JSON.stringify(RL.r));
  const r = await api().save_rules(draft);
  if(!r.ok){ taskErr(r); return; }
  S.rules = r.rules; S.inboxCount = r.inbox_count ?? S.inboxCount;
  await applyAnalysis(r);
  if(S.view==='rules') rulesInit();
  render();
  toast('Reglas guardadas y aplicadas.' + ((r.warnings||[]).length?`<br><span style="color:var(--org)">${r.warnings.map(esc).join('<br>')}</span>`:''), !!(r.warnings||[]).length);
}
async function unignore(id){
  const rules = JSON.parse(JSON.stringify(S.rules||{})); rules.playlist_mode = {...(rules.playlist_mode||{})}; delete rules.playlist_mode[id];
  const r = await api().save_rules(rules);
  if(!r.ok){ taskErr(r); return; }
  S.rules = r.rules; await applyAnalysis(r); render();
  toast(`<b>${esc(plName(id))}</b> vuelve a estar incluida. Dale 🔄 Analizar para leerla.`);

// ---------- acciones ----------
async function connect(){
  if(S.connected){ await api().disconnect(); S.connected=false; render(); return; }
  if(!S.settings.client_id){ openSettings(); toast('Primero pega el Client ID de tu app de Spotify.', true); return; }
  toast('Se abrió Spotify en tu navegador: autoriza y vuelve aquí…');
  const r = await api().connect();
  if(r.ok){ S.connected=true; toast(`Conectado como <b>${esc(r.user)}</b>.`); render(); loadPlaylists(); return; } else taskErr(r);
  render();
}
async function analyze(){
  if(!anySource()){ show('conn'); toast('Activa al menos una fuente: Spotify, Deezer o archivos exportados.', true); return; }
  if(running('analyze:all')) return;
  const p = api().analyze();
  if(!S.analysis || !S.analysis.some(p=>!p.pending)) setTimeout(()=>{ if(running('analyze:all')) $('main').innerHTML = progressCard('todas tus playlists','analyze:all'); }, 150);
  const r = await p;
  if(!r.ok){ taskErr(r); render(); return; }
  await applyAnalysis(r); S.foreign = r.foreign || {};
  render();
  toast(`Análisis listo: faltan <b>${missingUnique().length}</b> canciones y hay <b>${orgCount()}</b> por organizar.`);
  askForeign(r.ask_foreign || []);
}
let orgPid = null;
async function loadPlaylists(){
  if(!anySource()){ show('conn'); toast('Activa al menos una fuente: Spotify, Deezer o archivos exportados.', true); return; }
  const r = await api().list_playlists();
  if(!r.ok){ taskErr(r); return; }
  await applyAnalysis(r); S.foreign = r.foreign || {}; render();
  const pend = r.analysis.filter(p=>p.pending && !p.ignored).length, ch = r.analysis.filter(changed).length;
  toast(`${r.analysis.length} playlists.` + (pend?` <b>${pend}</b> sin analizar.`:'') + (ch?` <b>${ch}</b> cambiaron en Spotify (●).`:'') + ' Elige una y dale <b>🔄 Analizar</b>.');
  askForeign(r.ask_foreign || []);
}
async function analyzePlaylist(pid){
  if(running('analyze:'+pid)) return;
  const p = api().analyze_playlist(pid);
  setTimeout(render, 120);  // muestra su % apenas arranca (la tarea ya avisó por onTask)
  const r = await p;
  if(!r.ok){ taskErr(r); render(); return; }
  await applyAnalysis(r);
  render();
  const pl = S.analysis[plIdx(pid)]; if(!pl) return;
  const c = plStats(pl), oc = orgCount(pid);
  toast(`<b>${esc(pl.name)}</b>: ${c.here+c.other}/${c.total} las tienes, faltan <b>${c.missing}</b>` + (oc?`, <b>${oc}</b> en <code>${esc(base(S.settings.inbox))}</code> para organizar.`:'.'));
}
// el vigilante avisa cuando cambia la carpeta de descargas
window.onInboxChange = async (info) => {
  try{
    const st = await api().get_state();
    if(st.analysis && (S.rev===undefined || st.rev >= S.rev)) setAnalysis(st.analysis, st.rev);
    S.inboxCount = (info && info.count !== undefined) ? info.count : (st.inbox_count || 0);
    render();
    if(info && info.new_count){
      const oc = orgCount();
      toast(`⬇ Llegaron <b>${info.new_count}</b> archivo${info.new_count!==1?'s':''} a descargas` +
        (info.new.length?`: ${info.new.slice(0,3).map(esc).join(', ')}${info.new_count>3?'…':''}`:'') +
        (oc?`<br><b>${oc}</b> listos para organizar.`:'<br>Ninguno coincide todavía con una playlist analizada.'));
      const b=$('btnOrg'); b.classList.remove('pulse'); void b.offsetWidth; b.classList.add('pulse');
    }
  }catch(e){}
};
async function askOrganize(pid){
  orgPid = pid || null;
  if(!orgPid) return askOrganizeAll();
  const st = await api().get_state();
  const rows = toOrganize(orgPid), dups = dupList(orgPid);
  const plName = orgPid ? (S.analysis.find(p=>p.id===orgPid)||{}).name : null;
  const dests = new Set(rows.map(r=>r.dest_dir)).size;
  modal(`<h3>Organizar${plName?` «${esc(plName)}»`:''}</h3>
    <p>Sin duplicar archivos.${plName?' Solo las descargas de esta playlist.':''} Esto es lo que va a pasar:</p>
    <div class="box">📁 Se <b>mueven</b> ${rows.length} descarga${rows.length!==1?'s':''} a ${dests} carpeta${dests!==1?'s':''} dentro de <code>${esc(short(S.settings.dest_root))}</code>. Cada canción queda en una sola carpeta (la de su primera playlist).</div>
    ${dups.length?`<div class="box">🗂️ ${dups.length} descarga${dups.length!==1?'s':''} que ya tenías se aparta${dups.length!==1?'n':''} en <code>${esc(base(S.settings.inbox))}/_duplicados</code> para que la${dups.length!==1?'s':''} borres.</div>`:''}
    <div class="box">🎧 Las canciones que ya tienes en otras carpetas no se tocan: Rekordbox las usa donde están, con tus cues.</div>
    ${djChecks(st, plName)}
    <div class="actions"><button onclick="closeModal()">Cancelar</button><button class="warn" onclick="organize()">Organizar</button></div>`);
}
// ---------- organizar general: lo que coincide + lo que no coincide con ninguna playlist ----------
let OX = {st:null, groups:new Set(), loose:new Set(), dest:null};
async function askOrganizeAll(){
  const [st, ib] = await Promise.all([api().get_state(), api().inbox_status()]);
  OX = {st, ib, groups:new Set(), loose:new Set(), dest:null};
  S.inboxCount = ib.count; render();
  const rows = toOrganize(), dups = dupList(), dests = new Set(rows.map(r=>r.dest_dir)).size;
  const unmatched = ib.groups.reduce((a,g)=>a+g.count,0) + ib.loose.length;
  modal(`<h3>Organizar descargas</h3>
    <p><b>${ib.count}</b> archivo${ib.count!==1?'s':''} en <code>${esc(base(S.settings.inbox))}</code>.</p>
    <div class="box">✅ <b>${rows.length}</b> coinciden con canciones de tus playlists analizadas: se mueven a su carpeta (${dests} carpeta${dests!==1?'s':''}).
      ${dups.length?`<br>🗂️ <b>${dups.length}</b> ya las tenías: se apartan en <code>_duplicados</code>.`:''}</div>
    ${unmatched?`<div class="box warn">❓ <b>${unmatched}</b> no coinciden con ninguna playlist analizada${ib.pending?` (tienes <b>${ib.pending}</b> playlists sin analizar; puede que sean de ahí)`:''}.
        <div style="margin-top:8px"><button onclick="closeModal();analyze()">Analizar todo para ubicarlas</button></div></div>
      ${ib.groups.length?`<div style="margin:10px 0 4px;font-weight:650">Subcarpetas de descargas <span class="art">— márcalas para moverlas como carpeta de playlist</span></div>
        ${ib.groups.map((g,k)=>`<label class="oxrow"><input type="checkbox" onchange="this.checked?OX.groups.add(${jsq(g.name)}):OX.groups.delete(${jsq(g.name)});oxSum()">
          <div style="min-width:0"><div><b>${esc(g.name)}</b> <span class="art">(${g.count})</span> → 📁 ${esc(short(g.dest))}${g.dest_exists?' <span class="art">(ya existe: se juntan)</span>':''}</div>
          <div class="art" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${g.sample.map(esc).join(' · ')}${g.count>g.sample.length?' …':''}</div></div></label>`).join('')}`:''}
      ${ib.loose.length?`<div style="margin:12px 0 4px;font-weight:650;display:flex;align-items:center;gap:8px">Sueltos <span class="art">(${ib.loose.length})</span>
          <span style="margin-left:auto;display:flex;gap:6px"><button class="ghost" onclick="oxAllLoose(true)">Todos</button><button class="ghost" onclick="oxAllLoose(false)">Ninguno</button></span></div>
        <div style="max-height:180px;overflow:auto;border:1px solid var(--line);border-radius:8px">${ib.loose.map(f=>`<label class="oxrow" style="padding:5px 10px"><input type="checkbox" class="oxl" data-f="${esc(f)}" onchange="this.checked?OX.loose.add(this.dataset.f):OX.loose.delete(this.dataset.f);oxSum()"> <span>${esc(base(f))}</span></label>`).join('')}</div>
        <div style="display:flex;align-items:center;gap:8px;margin-top:8px"><button onclick="oxPickDest()">📁 Carpeta para los marcados…</button><span class="art" id="oxDest">sin elegir</span></div>`:''}`:''}
    ${djChecks(st, null)}
    <div class="actions"><span id="oxSum" class="art" style="margin-right:auto;align-self:center"></span><button onclick="closeModal()">Cancelar</button><button class="warn" id="oxGo" onclick="organize()">Organizar</button></div>`);
  oxSum();
}
function oxAllLoose(on){ document.querySelectorAll('input.oxl').forEach(c=>{ c.checked=on; on?OX.loose.add(c.dataset.f):OX.loose.delete(c.dataset.f); }); oxSum(); }
async function oxPickDest(){ const p = await api().pick_folder(OX.dest || S.settings.dest_root); if(p){ OX.dest=p; $('oxDest').textContent = short(p); oxSum(); } }
function oxSum(){
  const rows = toOrganize().length + dupList().length;
  const g = OX.ib ? OX.ib.groups.filter(x=>OX.groups.has(x.name)).reduce((a,x)=>a+x.count,0) : 0;
  const l = OX.dest ? OX.loose.size : 0;
  const n = rows + g + l, el = $('oxSum'), b = $('oxGo');
  if(el) el.innerHTML = n ? `Se moverán <b>${n}</b> archivo${n!==1?'s':''}` + (OX.loose.size && !OX.dest ? ' · <span style="color:var(--org)">elige carpeta para los sueltos</span>' : '') : 'Marca algo para mover';
  if(b) b.disabled = !n;
}
async function organize(){
  const rb = [...document.querySelectorAll('input.djchk')].filter(c=>c.checked).map(c=>c.dataset.k);
  const extra = orgPid ? null : {groups:[...OX.groups], files: OX.dest ? [...OX.loose].map(f=>({src:f, dest:OX.dest})) : []};
  const pid = orgPid;
  closeModal();
  const r = await api().organize(rb, pid, extra);
  if(!r.ok){ taskErr(r); return; }
  await applyAnalysis(r);
  try{ const st = await api().get_state(); S.inboxCount = st.inbox_count || 0; }catch(e){}
  render();
  const f = r.files; let msg = `<b>${f.moved}</b> movidas a su carpeta, ${f.duplicates} repetidas apartadas en _duplicados`;
  if(r.extra) msg += `<br><b>${r.extra.moved}</b> sin playlist movidas a la carpeta elegida` + (r.extra.duplicates?`, ${r.extra.duplicates} ya existían (a _duplicados)`:'');
  if(f.errors.length) msg += `, <span style="color:var(--miss)">${f.errors.length} errores</span>`;
  msg += djSummary(r.dj);
  if(Object.values(r.dj||{}).some(x=>x.stats&&x.stats.tracks_added)) msg += '<br>Al abrir tu programa de DJ, analiza las pistas nuevas.';
  toast(msg, Object.values(r.dj||{}).some(x=>x.error));
}
// programas de DJ que se actualizan al organizar (los activos en Conexiones)
function djChecks(st, plName){
  const d = st.destinations || {}, on = Object.entries(d).filter(([,x])=>x.enabled);
  if(!on.length) return `<div class="box">🎛️ No hay programas de DJ activos. Actívalos en <a class="lnk" onclick="closeModal();show('conn')">Conexiones</a>.</div>`;
  return `<div style="margin-top:12px;font-weight:650">Actualizar en tus programas de DJ ${plName?`(solo «${esc(plName)}»)`:''}</div>
    <div class="art" style="margin:2px 0 6px">Carpeta <b>${esc(S.settings.rekordbox_folder)}</b>, mismo orden que tus playlists. Antes se respalda cada librería.</div>` +
    on.map(([k,x])=>`<label style="display:flex;gap:10px;align-items:center;margin:4px 0;cursor:pointer">
      <input type="checkbox" class="djchk" data-k="${k}" ${x.running?'':'checked'}> <span>${esc(x.label)}${k==='m3u'?` <span class="art">→ ${esc(short(x.folder||''))}</span>`:''}</span>
      ${x.running?`<span style="color:var(--org)">⚠️ está abierto: ciérralo o no se aplicará</span>`:''}</label>`).join('');
}
function djSummary(dj){
  return Object.values(dj||{}).map(x => x.error ? `<br><span style="color:var(--org)">${esc(x.label)}: ${esc(x.error)}</span>`
    : `<br>${esc(x.label)}: ${x.stats.playlists_updated} playlists actualizadas${x.stats.tracks_added?`, ${x.stats.tracks_added} pistas nuevas`:''}${x.stats.backup?` (respaldo ${esc(x.stats.backup)})`:''}.`).join('');
}
async function exportMissing(){
  const r = await api().export_excel();
  if(r.ok) toast(`Excel con <b>${r.count}</b> canciones faltantes guardado en <code>${esc(short(r.path))}</code>`);
  else if(!r.cancelled) toast(esc(r.error), true);
}
function reveal(p){ api().reveal(p); }
function openUrl(u){ api().open_url(u); }

function openSettings(){
  const s = S.settings;
  modal(`<h3>Ajustes <span class="art" style="font-weight:400;font-size:12px">versión ${esc((S.version||{}).version||'?')}</span></h3>
    <div class="box"><b>App de Spotify:</b> en <code>developer.spotify.com/dashboard</code> crea una app (Web API), agrega como Redirect URI
      <code>${esc(s.redirect_uri)}</code> y pega aquí su Client ID. No necesitas el Client Secret.</div>
    <label class="f">Client ID</label><input class="t mono" id="sClient" value="${esc(s.client_id)}" placeholder="32 caracteres">
    <label class="f">Carpeta espejo de Spotify (una subcarpeta por playlist)</label>${folderField('sDest', s.dest_root)}
    <label class="f">Carpeta de descargas por organizar</label>${folderField('sInbox', s.inbox)}
    <label class="f">Otras carpetas donde ya tienes música</label>
    <div id="rootsList"></div>
    <button onclick="addRoot()" style="margin-top:6px">＋ Agregar carpeta…</button>
    <label class="f">Nombre de la carpeta de playlists en tus programas de DJ</label><input class="t" id="sRb" value="${esc(s.rekordbox_folder)}">
    <label class="f">Canciones que te gustan</label>
    <div style="display:flex;gap:10px;align-items:center"><input type="checkbox" id="sLiked" ${s.include_liked?'checked':''}>
      <span>Incluir como playlist llamada</span><input class="t" id="sLikedName" value="${esc(s.liked_name)}" style="width:180px"></div>
    <div class="actions"><button onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveSettings()">Guardar</button></div>`);
  draftRoots = [...(s.library_roots||[])]; renderRoots();
}
// ---------- selector de carpetas (Finder) ----------
let draftRoots = [];
function folderField(id, val){
  return `<div class="pick"><div class="pickpath" id="${id}" data-path="${esc(val)}" title="${esc(val)}" onclick="pickInto('${id}')">📁 ${esc(short(val)||'Sin elegir')}</div>
    <button onclick="pickInto('${id}')">Elegir…</button></div>`;
}
async function pickInto(id){
  const el=$(id); const p = await api().pick_folder(el.dataset.path);
  if(p){ el.dataset.path=p; el.title=p; el.textContent='📁 '+short(p); }
}
function renderRoots(){
  $('rootsList').innerHTML = draftRoots.length ? draftRoots.map((r,i)=>`<div class="pick" style="margin-top:6px">
    <div class="pickpath" title="${esc(r)}">📁 ${esc(short(r))}</div><button onclick="draftRoots.splice(${i},1);renderRoots()" title="Quitar">✕</button></div>`).join('')
    : '<div class="art" style="padding:4px 0">Ninguna</div>';
}
async function addRoot(){
  const p = await api().pick_folder(draftRoots[draftRoots.length-1]||'');
  if(p && !draftRoots.includes(p)){ draftRoots.push(p); renderRoots(); }
}
async function saveSettings(){
  const s = {client_id:$('sClient').value, dest_root:$('sDest').dataset.path, inbox:$('sInbox').dataset.path,
    library_roots:draftRoots, rekordbox_folder:$('sRb').value, include_liked:$('sLiked').checked, liked_name:$('sLikedName').value};
  const r = await api().save_settings(s);
  if(r && r.ok===false){ toast(esc(r.error), true); return; }
  const st = await api().get_state(); S.settings = st.settings; S.inboxCount = st.inbox_count || 0;
  if(st.analysis && (S.rev===undefined || st.rev >= S.rev)) setAnalysis(st.analysis, st.rev);
  closeModal(); render();
  toast(`Ajustes guardados. Descargas: <code>${esc(short(S.settings.inbox))}</code> (${S.inboxCount} archivo${S.inboxCount!==1?'s':''}).`);
}

window.addEventListener('pywebviewready', async () => {
  const st = await api().get_state();
  S.connected = st.connected; S.settings = st.settings; S.analysis = st.analysis; S.rev = st.rev; S.foreign = st.foreign || {};
  S.home = st.home || ''; S.win = !!st.win; S.inboxCount = st.inbox_count || 0; S.pinned = new Set(st.pinned || []); S.version = st.version || {};
  S.rules = st.rules || {}; S.formats = st.formats || []; S.sources = st.sources || {}; S.dests = st.destinations || {};
  setTimeout(checkUpdates, 1500);
  try{ api().start_watch(); }catch(e){}
  render();
  if(S.analysis) $('progTxt').textContent = 'Mostrando el último análisis. Toca Analizar para actualizar.';
  const pend = Object.entries(S.foreign).filter(([,f]) => (f.choice||'preguntar')==='preguntar').map(([id])=>id);
  if(pend.length) askForeign(pend);
});
$('mbg').addEventListener('click', e => { if(e.target.id==='mbg') closeModal(); });
</script>
