# Arma los instaladores de BrainOrder (.dmg para Mac y .exe para Windows) y los publica en Releases.
# Corre solo cuando cambia version.json en main (cada versión nueva) o a mano desde la pestaña Actions.
name: Instaladores

on:
  push:
    branches: [main]
    paths: [version.json, empaquetar/**, .github/workflows/instaladores.yml]
  workflow_dispatch:

# Lo mínimo: armar solo necesita leer; únicamente «publicar» puede escribir en Releases.
permissions:
  contents: read

concurrency:
  group: instaladores
  cancel-in-progress: true

jobs:
  pruebas:
    # Si una prueba falla no se arma ni se publica ningún instalador.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Componentes
        run: python -m pip install --disable-pip-version-check -q -r requirements.txt pyflakes
      - name: Revisar el código
        run: |
          python -m compileall -q .
          python -m pyflakes $(git ls-files '*.py' ':!ct/*')
      - name: Pruebas
        run: |
          for t in ct/test_*.py; do echo "== $t"; python "$t" || exit 1; done

  mac:
    needs: pruebas
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel]   # Apple Silicon e Intel
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - name: Armar BrainOrder.app y el .dmg
        run: bash empaquetar/mac/construir_dmg.sh
      - uses: actions/upload-artifact@v5
        with:
          name: mac-${{ matrix.os }}
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    needs: pruebas
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Armar el instalador .exe
        shell: bash
        run: bash empaquetar/windows/construir.sh
      - name: Probar el instalador (instala, abre BrainOrder y revisa que la ventana siga abierta)
        shell: pwsh
        run: |
          $exe = (Get-ChildItem dist\*.exe).FullName
          Start-Process $exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          $app = "$env:LOCALAPPDATA\Programs\BrainOrder"
          $p = Start-Process "$app\python\python.exe" -ArgumentList "`"$app\app\arranque.py`"","--seed" -WorkingDirectory $app -RedirectStandardError err.txt -PassThru
          Start-Sleep 45
          $ok = -not $p.HasExited
          "--- registro"; Get-Content "$env:APPDATA\BrainOrder\brainorder.log" -ErrorAction SilentlyContinue
          "--- errores"; Get-Content err.txt
          if ($ok) { Stop-Process -Id $p.Id -Force; "BrainOrder abrió y siguió abierta: OK" } else { Write-Error "BrainOrder se cerró sola al abrir"; exit 1 }
      - uses: actions/upload-artifact@v5
        with:
          name: windows
          path: dist/*.exe
          if-no-files-found: error

  publicar:
    needs: [mac, windows]
    if: ${{ !cancelled() && needs.mac.result != 'skipped' }}   # publica lo que sí se armó aunque otro falle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Publicar en Releases
        run: |
          VER=$(jq -r .version version.json)
          NOTES=$(jq -r .notes version.json)
          BODY=$(printf '%s\n\n**Instalar:**\n- **Mac con chip Apple (M1, M2, M3, M4…):** `BrainOrder-%s-Mac-AppleSilicon.dmg`\n- **Mac con Intel:** `BrainOrder-%s-Mac-Intel.dmg`\n- **Windows 10/11:** `BrainOrder-%s-Windows.exe`\n\nNo están firmados con cuenta de desarrollador: la primera vez macOS/Windows avisan. Mac: Configuración del Sistema → Privacidad y seguridad → «Abrir igualmente». Windows: «Más información» → «Ejecutar de todas formas».\nDespués BrainOrder se actualiza sola.' "$NOTES" "$VER" "$VER" "$VER")
          ls -la dist
          ls dist/* >/dev/null 2>&1 || { echo "No se armó ningún instalador"; exit 1; }
          if gh release view "v$VER" >/dev/null 2>&1; then
            gh release upload "v$VER" dist/* --clobber
            gh release edit "v$VER" --notes "$BODY" --latest
          else
            gh release create "v$VER" dist/* --title "BrainOrder $VER" --notes "$BODY" --latest
          fi
